<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumo Firestore P4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: encabezado con selector de idioma, 4 indicadores, gráfica diaria a ancho completo, luego app y colección lado a lado.
   Paleta: grafito frío + azul petróleo como acento; ámbar y rojo solo para estado. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #15212c;
  --ink2: #4d5b68;
  --line: #d5dce3;
  --accent: #0b7a86;
  --accent-soft: #d6eef0;
  --ok: #2f7d4f;
  --warn: #b86e00;
  --bad: #b83a2e;
  --bar: #0b7a86;
  --bar-dim: #9fcfd4;
  --f-sans: "IBM Plex Sans", system-ui, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171e; --panel: #17222b; --ink: #e6edf2; --ink2: #9fb0bd; --line: #2a3a46;
    --accent: #4cc3cf; --accent-soft: #163a40; --ok: #5cc088; --warn: #e5a23c; --bad: #ef7b6e;
    --bar: #4cc3cf; --bar-dim: #2c6a72; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171e; --panel: #17222b; --ink: #e6edf2; --ink2: #9fb0bd; --line: #2a3a46;
  --accent: #4cc3cf; --accent-soft: #163a40; --ok: #5cc088; --warn: #e5a23c; --bad: #ef7b6e;
  --bar: #4cc3cf; --bar-dim: #2c6a72; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 14px; line-height: 1.45; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
h1 { font-family: var(--f-head); font-weight: 700; font-size: 28px; letter-spacing: .2px; margin: 0; text-wrap: balance; }
.sub { color: var(--ink2); margin: 2px 0 0; }
.lang { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.lang button { font: 600 12px var(--f-mono); padding: 7px 12px; border: 0; background: transparent; color: var(--ink2); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.lang button:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.badge { display: inline-block; font: 500 11px var(--f-mono); letter-spacing: .6px; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); padding: 3px 8px; border-radius: 4px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.kpi .lbl { color: var(--ink2); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
.kpi .val { font-family: var(--f-head); font-weight: 700; font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; margin-top: 4px; }
.kpi .note { color: var(--ink2); font-size: 12px; margin-top: 4px; }
.meter { height: 8px; background: var(--line); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }
.meter.hot i { background: var(--warn); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.pill.ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.card h2 { font-family: var(--f-head); font-size: 18px; margin: 0 0 2px; font-weight: 600; }
.card .hint { color: var(--ink2); font-size: 12px; margin: 0 0 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
svg text { font-family: var(--f-mono); font-size: 10px; fill: var(--ink2); }
.apps { display: flex; flex-direction: column; gap: 10px; }
.app { display: grid; grid-template-columns: 130px 1fr 92px; gap: 10px; align-items: center; }
.app .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app .track { height: 14px; background: var(--line); border-radius: 3px; overflow: hidden; }
.app .track i { display: block; height: 100%; background: var(--bar); }
.app:first-child .track i { background: var(--warn); }
.app .num { text-align: right; font: 500 13px var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 460px; }
th { text-align: left; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; color: var(--ink2); padding: 6px 8px; border-bottom: 1px solid var(--line); }
td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td.coll { font-family: var(--f-mono); font-size: 12px; word-break: break-all; }
td .tip { color: var(--ink2); font-size: 12px; }
tr:last-child td { border-bottom: 0; }
.how { font-size: 13px; color: var(--ink2); }
.how b { color: var(--ink); font-weight: 600; }
.how ul { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink2); margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--bar); }
.legend span.q::before { background: none; border-top: 2px dashed var(--warn); border-radius: 0; height: 0; width: 14px; vertical-align: 3px; }
.legend span.t::before { background: var(--warn); }
@media (max-width: 520px) { .app { grid-template-columns: 96px 1fr 70px; } h1 { font-size: 24px; } }
@media (prefers-reduced-motion: no-preference) { .meter i, .app .track i { transition: width .4s; } }
button.act { font: 600 12px var(--f-mono); padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); cursor: pointer; }
button.act:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink2); }
.msg.err { border-color: var(--bad); color: var(--bad); }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1 id="t-title"></h1>
      <p class="sub" id="t-sub"></p>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="badge" id="t-upd"></span>
      <button type="button" class="act" id="btn-ref"></button>
      <div class="lang" role="group" aria-label="Idioma / Language / 언어">
        <button type="button" data-l="es" aria-pressed="true">ES</button>
        <button type="button" data-l="en" aria-pressed="false">EN</button>
        <button type="button" data-l="ko" aria-pressed="false">KO</button>
      </div>
    </div>
  </header>

  <div id="estado"></div>
  <div id="main" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <section class="kpis" id="kpis"></section>
      <section class="card">
        <h2 id="t-daily"></h2>
        <p class="hint" id="t-daily-h"></p>
        <svg id="daily" viewBox="0 0 700 230" width="100%" role="img" aria-label="Lecturas por día"></svg>
        <div class="legend"><span id="lg-reads"></span><span class="t" id="lg-today"></span><span class="q" id="lg-quota"></span></div>
      </section>
      <div class="grid2">
        <section class="card">
          <h2 id="t-apps"></h2>
          <p class="hint" id="t-apps-h"></p>
          <div class="apps" id="apps"></div>
        </section>
        <section class="card">
          <h2 id="t-alert"></h2>
          <p class="hint" id="t-alert-h"></p>
          <div id="alerts" style="display:flex;flex-direction:column;gap:10px"></div>
        </section>
      </div>
      <section class="card">
        <h2 id="t-coll"></h2>
        <p class="hint" id="t-coll-h"></p>
        <div class="tbl-scroll"><table id="colls"></table></div>
      </section>
      <section class="card how" id="how"></section>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-firestore-compat.min.js"></script>
<script>
var QUOTA = 50000, PRECIO_100K = 0.06, DIAS = 14;
var I18N = {

    a1y:"Hoy vas en {p}%.", a1n:"Hoy vas en {p}%. Aviso cuando se cruce.", a2y:"{app} lleva {p}%.", a2n:"La que más consume es {app}, con {p}%.", a3y:"{n} día(s) este mes.", a3n:"Ninguno este mes.",
    coll:"Qué colecciones se leen más", collH:"Dónde se van las lecturas de hoy, con una idea para bajarlas.",
    c_coll:"Colección", c_reads:"Hoy", c_share:"%", c_tip:"Cómo bajarla",
    tipAlto:"Concentra buena parte del consumo. Revisar si se lee completa y usar listener o caché.", tipMedio:"Consumo medio. Cachear si se lee al abrir cada pantalla.", tipBajo:"Consumo bajo. Sin cambios.",
    howT:"Cómo se mide", how1:"Cada app cuenta sus propias lecturas y las suma en un solo documento por día, una vez cada 5 minutos.", how2:"Cuenta igual que la factura: un documento leído es una lectura; lo que sale de la caché del navegador no cuenta.", how3:"Solo aparecen las apps que ya tienen el contador instalado. Lecturas hechas desde la consola de Firebase u otras herramientas no se ven aquí.", how4:"Este tablero lee unos 15 documentos al abrirse y no se refresca solo."
  },
  en: {
    title:"Firestore Usage", sub:"Blaze plan · project mes-production-esp · the day rolls over at midnight Pacific time, like Firebase's quota",
    upd:"Updated ", ref:"↻ Refresh", cargando:"Loading usage…",
    vacio:"No data yet. Apps start counting once they are opened with the counter installed; check back in a few minutes.",
    errPerm:"Could not read usage (permission denied). The uso_lecturas collection must be readable in the Firestore rules.",
    errGen:"Could not read usage: ",
    k1:"Reads today", k1n:"of 50,000 free per day", k2:"Week peak", k2n:"highest day of the last 7", k3:"Reads this month", k3n:"daily average: ", k4:"Estimated cost this month", k4n:"days over 50,000: ",
    st_ok:"Normal", st_warn:"Near the limit", st_bad:"Over the limit",
    daily:"Reads per day", dailyH:"Last 14 days. The dashed line is the daily free quota; only reads beyond it are billed.",
    lgReads:"Reads", lgToday:"Today", lgQuota:"Free quota (50,000)",
    apps:"Who uses the most", appsH:"Today's reads per app, highest first.",
    alert:"Alerts", alertH:"Thresholds being watched.",
    a1:"80% of the daily quota (40,000)", a2:"One app above 40% of today's total", a3:"Any day above 50,000 this month",
    a1y:"Today you are at {p}%.", a1n:"Today you are at {p}%. Alert when crossed.", a2y:"{app} is at {p}%.", a2n:"The highest is {app}, at {p}%.", a3y:"{n} day(s) this month.", a3n:"None this month.",
    coll:"Most-read collections", collH:"Where today's reads go, with an idea to reduce them.",
    c_coll:"Collection", c_reads:"Today", c_share:"%", c_tip:"How to reduce",
    tipAlto:"Takes a large share of the usage. Check whether it is read in full and use a listener or cache.", tipMedio:"Medium usage. Cache it if it is read each time a screen opens.", tipBajo:"Low usage. No change.",
    howT:"How it is measured", how1:"Each app counts its own reads and adds them to one document per day, once every 5 minutes.", how2:"Counted like the bill: one document read is one read; anything served from the browser cache does not count.", how3:"Only apps that already have the counter installed appear. Reads made from the Firebase console or other tools do not show here.", how4:"This board reads about 15 documents when opened and does not refresh by itself."
  },
  ko: {
    title:"Firestore 사용량", sub:"Blaze 요금제 · 프로젝트 mes-production-esp · 날짜는 Firebase 한도처럼 태평양 시간 자정에 바뀝니다",
    upd:"업데이트 ", ref:"↻ 새로고침", cargando:"사용량 불러오는 중…",
    vacio:"아직 데이터가 없습니다. 카운터가 설치된 앱을 열면 집계가 시작됩니다. 몇 분 후 다시 확인하세요.",
    errPerm:"사용량을 읽을 수 없습니다(권한 거부). Firestore 규칙에서 uso_lecturas 컬렉션 읽기를 허용해야 합니다.",
    errGen:"사용량을 읽을 수 없습니다: ",
    k1:"오늘 읽기", k1n:"하루 무료 50,000건 중", k2:"주간 최고치", k2n:"최근 7일 중 가장 높은 날", k3:"이번 달 읽기", k3n:"일 평균: ", k4:"이번 달 예상 비용", k4n:"50,000건 초과 일수: ",
    st_ok:"정상", st_warn:"한도 근접", st_bad:"한도 초과",
    daily:"일별 읽기", dailyH:"최근 14일. 점선은 하루 무료 한도이며, 초과분만 과금됩니다.",
    lgReads:"읽기", lgToday:"오늘", lgQuota:"무료 한도 (50,000)",
    apps:"가장 많이 쓰는 앱", appsH:"오늘 앱별 읽기, 많은 순서.",
    alert:"알림", alertH:"감시 중인 기준.",
    a1:"일일 한도의 80% (40,000)", a2:"한 앱이 오늘 전체의 40% 초과", a3:"이번 달 하루 50,000건 초과",
    a1y:"오늘 {p}%입니다.", a1n:"오늘 {p}%입니다. 넘으면 알림.", a2y:"{app}이(가) {p}%입니다.", a2n:"가장 많은 앱은 {app}, {p}%입니다.", a3y:"이번 달 {n}일.", a3n:"이번 달 없음.",
    coll:"가장 많이 읽는 컬렉션", collH:"오늘 읽기가 어디에 쓰이는지와 줄이는 방법.",
    c_coll:"컬렉션", c_reads:"오늘", c_share:"%", c_tip:"줄이는 방법",
    tipAlto:"사용량의 큰 비중을 차지합니다. 전체를 읽는지 확인하고 리스너나 캐시를 사용하세요.", tipMedio:"중간 사용량. 화면을 열 때마다 읽는다면 캐시하세요.", tipBajo:"사용량이 적습니다. 변경 없음.",
    howT:"측정 방법", how1:"각 앱이 자체 읽기를 세어 하루 한 문서에 5분마다 한 번 합산합니다.", how2:"청구서와 같은 방식으로 셉니다. 문서 하나를 읽으면 1회이며, 브라우저 캐시에서 나온 것은 세지 않습니다.", how3:"카운터가 설치된 앱만 표시됩니다. Firebase 콘솔 등 다른 도구의 읽기는 여기에 나타나지 않습니다.", how4:"이 화면은 열 때 문서 약 15개를 읽으며 자동으로 새로고침하지 않습니다."
  }
};
var lang = "es", DATA = null, ERR = null, CARGANDO = true;
try { var sv = localStorage.getItem("consumoLang"); if (sv && I18N[sv]) lang = sv; } catch (e) {}
function t(k) { return I18N[lang][k]; }
function el(id) { return document.getElementById(id); }
function fmt(n) { return Math.round(n).toLocaleString("en-US"); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function fill(s, o) { return s.replace(/\{(\w+)\}/g, function (m, k) { return o[k]; }); }
function hoyPT() { return new Date().toLocaleDateString("en-CA", { timeZone: "America/Los_Angeles" }); }
function restaDias(iso, n) { var d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() - n); return d.toISOString().slice(0, 10); }

firebase.initializeApp({ apiKey:"AIzaSyDbaC1kFX4ERhndtXDyHg8eCcexP5IjAuI", authDomain:"mes-production-esp.firebaseapp.com", projectId:"mes-production-esp" });
var db = firebase.firestore();

function cargar() {
  CARGANDO = true; ERR = null; render();
  var hoy = hoyPT(), desde = restaDias(hoy, 30);
  db.collection("uso_lecturas").where(firebase.firestore.FieldPath.documentId(), ">=", desde).get().then(function (snap) {
    var porDia = {};
    snap.forEach(function (d) { porDia[d.id] = d.data(); });
    DATA = { hoy: hoy, porDia: porDia, n: snap.size };
    CARGANDO = false; render();
  }).catch(function (e) {
    ERR = e; CARGANDO = false; render();
  });
}

function totalDe(p, d) { return (p[d] && p[d].total) || 0; }
function ordena(mapa) { return Object.keys(mapa || {}).map(function (k) { return [k, mapa[k]]; }).sort(function (a, b) { return b[1] - a[1]; }); }

function render() {
  document.documentElement.lang = lang;
  el("t-title").textContent = t("title"); el("t-sub").textContent = t("sub"); el("btn-ref").textContent = t("ref");
  document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.l === lang ? "true" : "false"); });
  var est = el("estado"), main = el("main");
  el("t-upd").textContent = "";
  if (CARGANDO) { est.innerHTML = '<div class="msg">' + t("cargando") + '</div>'; main.hidden = true; return; }
  if (ERR) {
    var perm = ERR.code === "permission-denied";
    est.innerHTML = '<div class="msg err">' + esc(perm ? t("errPerm") : t("errGen") + (ERR.message || ERR)) + '</div>'; main.hidden = true; return;
  }
  if (!DATA || !DATA.n) { est.innerHTML = '<div class="msg">' + t("vacio") + '</div>'; main.hidden = true; return; }
  est.innerHTML = ""; main.hidden = false;

  var p = DATA.porDia, hoy = DATA.hoy, doc = p[hoy] || {};
  var today = totalDe(p, hoy), pct = Math.round(today * 100 / QUOTA);
  var estado = pct >= 100 ? "bad" : pct >= 80 ? "warn" : "ok";
  if (doc.actualizado) el("t-upd").textContent = t("upd") + new Date(doc.actualizado).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

  var dias = []; for (var i = DIAS - 1; i >= 0; i--) { var k = restaDias(hoy, i); dias.push([k.slice(5), totalDe(p, k)]); }
  var semana = 0; for (i = 0; i < 7; i++) semana = Math.max(semana, totalDe(p, restaDias(hoy, i)));
  var mes = hoy.slice(0, 7), mesTotal = 0, mesDias = 0, mesSobre = 0, costo = 0;
  Object.keys(p).forEach(function (d) { if (d.slice(0, 7) !== mes) return; var v = totalDe(p, d); mesTotal += v; mesDias++; if (v > QUOTA) { mesSobre++; costo += (v - QUOTA) * PRECIO_100K / 100000; } });
  var avg = mesDias ? mesTotal / mesDias : 0;

  el("kpis").innerHTML =
    '<div class="kpi"><div class="lbl">' + t("k1") + '</div><div class="val">' + fmt(today) + '</div>' +
      '<div class="meter' + (estado !== "ok" ? " hot" : "") + '"><i style="width:' + Math.min(100, pct) + '%"></i></div>' +
      '<div class="note">' + pct + '% · ' + t("k1n") + ' <span class="pill ' + (estado === "ok" ? "ok" : "warn") + '">' + t("st_" + estado) + '</span></div></div>' +
    '<div class="kpi"><div class="lbl">' + t("k2") + '</div><div class="val">' + fmt(semana) + '</div><div class="note">' + t("k2n") + '</div></div>' +
    '<div class="kpi"><div class="lbl">' + t("k3") + '</div><div class="val">' + fmt(mesTotal) + '</div><div class="note">' + t("k3n") + fmt(avg) + '</div></div>' +
    '<div class="kpi"><div class="lbl">' + t("k4") + '</div><div class="val">US$ ' + costo.toFixed(2) + '</div><div class="note">' + t("k4n") + mesSobre + '</div></div>';

  el("t-daily").textContent = t("daily"); el("t-daily-h").textContent = t("dailyH");
  el("lg-reads").textContent = t("lgReads"); el("lg-today").textContent = t("lgToday"); el("lg-quota").textContent = t("lgQuota");
  dibuja(dias);

  var apps = ordena(doc.apps), colls = ordena(doc.colls);
  el("t-apps").textContent = t("apps"); el("t-apps-h").textContent = t("appsH");
  var mx = apps.length ? apps[0][1] : 1;
  el("apps").innerHTML = apps.map(function (a, n) {
    var s = today ? Math.round(a[1] * 100 / today) : 0;
    return '<div class="app"><span class="name" title="' + esc(a[0]) + '">' + esc(a[0]) + '</span><span class="track"><i style="width:' + (a[1] * 100 / mx) + '%"></i></span><span class="num">' + fmt(a[1]) + ' · ' + s + '%</span></div>';
  }).join("") || '<div class="tip" style="color:var(--ink2)">—</div>';

  el("t-alert").textContent = t("alert"); el("t-alert-h").textContent = t("alertH");
  var topApp = apps.length ? apps[0] : null, topPct = topApp && today ? Math.round(topApp[1] * 100 / today) : 0;
  var al = [
    [pct >= 80, t("a1"), fill(pct >= 80 ? t("a1y") : t("a1n"), { p: pct })],
    [topPct > 40, t("a2"), topApp ? fill(topPct > 40 ? t("a2y") : t("a2n"), { app: topApp[0], p: topPct }) : "—"],
    [mesSobre > 0, t("a3"), mesSobre ? fill(t("a3y"), { n: mesSobre }) : t("a3n")]
  ];
  el("alerts").innerHTML = al.map(function (a) {
    return '<div><span class="pill ' + (a[0] ? "warn" : "ok") + '">' + (a[0] ? t("st_warn") : t("st_ok")) + '</span> <b>' + a[1] + '</b><div style="color:var(--ink2);font-size:12px;margin-top:2px">' + esc(a[2]) + '</div></div>';
  }).join("");

  el("t-coll").textContent = t("coll"); el("t-coll-h").textContent = t("collH");
  el("colls").innerHTML = '<thead><tr><th>' + t("c_coll") + '</th><th class="n">' + t("c_reads") + '</th><th class="n">' + t("c_share") + '</th><th>' + t("c_tip") + '</th></tr></thead><tbody>' +
    colls.map(function (c) {
      var s = today ? Math.round(c[1] * 100 / today) : 0, tip = s >= 25 ? t("tipAlto") : s >= 10 ? t("tipMedio") : t("tipBajo");
      return '<tr><td class="coll">' + esc(c[0]) + '</td><td class="n">' + fmt(c[1]) + '</td><td class="n">' + s + '</td><td><span class="tip">' + tip + '</span></td></tr>';
    }).join("") + '</tbody>';

  el("how").innerHTML = '<h2>' + t("howT") + '</h2><ul><li>' + t("how1") + '</li><li>' + t("how2") + '</li><li>' + t("how3") + '</li><li>' + t("how4") + '</li></ul>';
}

function dibuja(d) {
  var W = 700, H = 230, L = 44, R = 12, T = 12, B = 28;
  var maxV = d.reduce(function (m, x) { return Math.max(m, x[1]); }, QUOTA);
  var top = Math.ceil(maxV * 1.1 / 20000) * 20000;
  var iw = W - L - R, ih = H - T - B, bw = iw / d.length;
  var y = function (v) { return T + ih - v * ih / top; };
  var s = "";
  for (var g = 0; g <= top; g += 20000) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="var(--line)" stroke-width="1"/>';
    s += '<text x="' + (L - 6) + '" y="' + (y(g) + 3) + '" text-anchor="end">' + fmt(g) + '</text>';
  }
  d.forEach(function (p, i) {
    var x = L + i * bw + bw * 0.16, w = bw * 0.68, last = i === d.length - 1, h = Math.max(0, T + ih - y(p[1]));
    s += '<rect x="' + x + '" y="' + y(p[1]) + '" width="' + w + '" height="' + h + '" rx="2" fill="' + (last ? "var(--warn)" : "var(--bar)") + '"><title>' + p[0] + ': ' + fmt(p[1]) + '</title></rect>';
    s += '<text x="' + (x + w / 2) + '" y="' + (H - 10) + '" text-anchor="middle">' + p[0].slice(3) + '</text>';
  });
  s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(QUOTA) + '" y2="' + y(QUOTA) + '" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  el("daily").innerHTML = s;
}

document.querySelectorAll(".lang button").forEach(function (b) {
  b.addEventListener("click", function () { lang = b.dataset.l; try { localStorage.setItem("consumoLang", lang); } catch (e) {} render(); });
});
el("btn-ref").addEventListener("click", cargar);
render(); cargar();
</script>
</body>
</html>
