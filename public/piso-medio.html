<html lang="es">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Medio proceso · Piso P4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-firestore-compat.min.js"></script>

<style>
:root{--bg:#0a0e1a;--card:#111827;--card2:#0d1220;--border:#1f2a3d;--text:#e8edf5;--text2:#8b96a8;--text3:#5c6678;--green:#00e676;--red:#ff4d4d;--yellow:#f1c40f;--accent:#4da6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:16px}
.wrap{max-width:1400px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:26px;margin:0}
.langs{display:flex;gap:4px;align-items:center}
.langs button{background:#0d1220;border:1px solid var(--border);border-radius:6px;padding:4px 7px;cursor:pointer;transition:all .2s;opacity:.5}
.langs button:hover{opacity:.85;transform:scale(1.1)}
.langs button.on{opacity:1;border-color:var(--accent);background:var(--card);box-shadow:0 0 8px rgba(79,142,247,.3)}
.langs img{width:28px;height:20px;border-radius:3px;display:block}
.sub{color:var(--text2);font-size:15px;margin-bottom:14px}
.sub .old{color:var(--yellow);font-weight:700}
.corte{display:inline-block;padding:2px 10px;border-radius:8px}
.corte.ambar{background:rgba(241,196,15,.18);color:var(--yellow);font-weight:800;font-size:16px;animation:corteBlink 1.2s ease-in-out infinite}
@keyframes corteBlink{0%,100%{opacity:1}50%{opacity:.25}}
.tbl tr.run-now td{animation:runBlink 1.2s ease-in-out infinite}
.tbl tr.run-now td:first-child{box-shadow:inset 6px 0 0 var(--accent)}
.runtag{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--accent);color:#04203f;letter-spacing:.5px}
@keyframes runBlink{0%,100%{background:rgba(77,166,255,.30)}50%{background:rgba(77,166,255,.04)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.kpi .l{font-size:14px;color:var(--text2)}
.kpi .v{font-size:32px;font-weight:800;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl th{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);text-align:left;padding:12px 10px;border-bottom:2px solid var(--border)}
.tbl td{padding:14px 10px;border-top:1px solid var(--border);font-size:20px}
.r,.tbl th.r{text-align:right}
.sep td{background:#151d2e;color:var(--text2);font-size:15px;font-weight:700;padding:8px 12px}
.num{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;background:var(--green);color:#002b14;font-weight:900;font-size:22px}
.num.wait{background:#1f2a3d;color:var(--text2);font-size:18px}
.mdl{font-weight:800;color:var(--accent)}
.code{font-size:12px;color:var(--text3)}
.mdl + .code{font-size:15px;font-weight:700;color:#fcd34d;letter-spacing:.3px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;margin:2px}
.ok{background:rgba(0,230,118,.15);color:var(--green)}
.par{background:rgba(241,196,15,.18);color:var(--yellow)}
.no{background:rgba(255,77,77,.18);color:var(--red)}
.chip[data-tip]{cursor:help}
.dia{background:#1f2a3d;color:var(--text2);white-space:nowrap}
.dia.hoy{background:rgba(77,166,255,.22);color:var(--accent)}
#chipTip{position:fixed;z-index:9999;display:none;pointer-events:none;background:#0b1220;color:#fff;border:1px solid #3a4a66;border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.5);max-width:360px}
#chipTip b{color:#4da6ff}#chipTip .f{color:#ff4d4d;font-weight:800}#chipTip .ok{color:#00e676;font-weight:800;background:none}#chipTip .pp{color:#f1c40f;font-weight:800}
.bar{background:#1f2a3d;height:12px;border-radius:6px;min-width:90px}
.bar div{height:12px;border-radius:6px}
.est{font-weight:800;font-size:18px}
.done td{background:rgba(0,230,118,.07)}
.sep.sepdone td{background:rgba(0,230,118,.14);color:var(--green)}
.num.ok{background:rgba(0,230,118,.2);color:var(--green);border:2px solid var(--green)}
.prodok{color:var(--green);font-weight:900;font-size:22px}
.foot{color:var(--text3);font-size:13px;margin-top:10px}
.msg{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--text2);font-size:18px}
.acciones{display:flex;gap:6px;align-items:center;margin-right:8px}
.acciones button,.tabs button{background:#0d1220;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.acciones button:hover,.tabs button:hover{border-color:var(--accent)}
.derecha{display:flex;align-items:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.tabs button{font-size:18px;font-weight:900;padding:8px 16px;color:var(--text2);border-radius:10px}
.tabs button small{display:block;font-size:11px;font-weight:700;color:var(--text3)}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:#102238;box-shadow:0 0 8px rgba(79,142,247,.3)}
.tabs button.auto.on{border-color:var(--green);color:var(--green);background:#0b2a1b}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.tblmain{overflow-y:auto;overflow-x:auto;overscroll-behavior:contain}
.tblmain .tbl{overflow:visible}
.tblmain .tbl thead th{position:sticky;top:0;z-index:5;background:#1b2538;box-shadow:0 2px 0 var(--border)}
@media (max-width:800px){.acciones,.derecha,.top{flex-wrap:wrap}.tbl{min-width:980px;overflow:visible}.tbl td{font-size:15px;padding:10px 6px}.kpi .v{font-size:24px}h1{font-size:20px}}
@page{size:letter landscape;margin:8mm}
@media print{
  :root{--bg:#fff;--card:#fff;--card2:#fff;--border:#999;--text:#000;--text2:#222;--text3:#555;--green:#000;--red:#000;--yellow:#000;--accent:#000}
  *{animation:none!important;box-shadow:none!important;background:transparent!important;color:#000!important}
  body{padding:0}.acciones,.langs,.bar,.tabs{display:none!important}
  .tblwrap{overflow:visible!important;max-height:none!important}.tbl th,.tbl td{font-size:11px;padding:3px 5px;position:static!important}
}
.login{max-width:340px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.login input{width:100%;margin:6px 0;padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px}
.login button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#04203f;font-weight:800;font-size:15px;cursor:pointer}
.login .err{color:var(--red);font-size:13px;margin-top:8px}
.login a{display:block;margin-top:12px;color:var(--accent);font-size:13px;cursor:pointer;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:380px;width:100%}
.modal .box button.sec{background:transparent;border:1px solid var(--border);color:var(--text2);margin-top:6px}
.hide{display:none!important}
#pick{display:none}
#pick{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;color:#000;background:#fff}
#pick .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
#pick h2{font-size:18px;margin:0}
#pick .pinfo{font-size:10px}
#pick .firmas{font-size:10px;line-height:2}
#pick .mh{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #000;padding:4px 8px;margin-top:8px;font-size:12px;font-weight:800;page-break-after:avoid}
#pick .pn{display:inline-flex;width:20px;height:20px;border:1.5px solid #000;border-radius:50%;align-items:center;justify-content:center;margin-right:6px;font-size:11px}
#pick table{width:100%;border-collapse:collapse;margin:2px 0 4px;page-break-inside:avoid}
#pick th{font-size:9px;text-align:left;border-bottom:1.5px solid #000;padding:3px 4px;text-transform:uppercase}
#pick td{font-size:11px;border-bottom:0.5px solid #aaa;padding:4px}
#pick .r{text-align:right}
#pick .box{display:inline-block;width:13px;height:13px;border:1.5px solid #000;border-radius:2px}
#pick .nota{font-size:10px;font-weight:700;text-decoration:underline}
#pick .res{margin-top:10px;border-top:2px solid #000;padding-top:4px;page-break-inside:avoid}
#pick .res h3{font-size:12px;margin:2px 0 4px}
#pick .pfoot{font-size:9px;color:#444;margin-top:6px}
#pickBar{display:none}
body.vista-pick,body.vista-pick.fit{overflow:auto!important;height:auto!important;padding:0!important}
body.vista-pick .wrap{display:none!important}
body.vista-pick #pickBar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10;padding:10px 16px;background:#0d1220;border-bottom:1px solid #334}
body.vista-pick #pickBar .pbt{font-weight:800;color:#fff;font-size:15px}
body.vista-pick #pickBar button{font-size:14px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid #556;background:#1b2436;color:#fff}
body.vista-pick #pickBar button.imp{background:#00bcd4;border-color:#00bcd4;color:#001}
body.vista-pick #pick{display:block!important;max-width:1000px;margin:16px auto;padding:24px;border-radius:6px}
@media print{#pickBar{display:none!important}body.vista-pick #pick{margin:0;padding:0;max-width:none;border-radius:0}}
@media print{body.modo-pick .wrap{display:none!important}body.modo-pick #pick{display:block!important}#pick th,#pick td{color:#000!important}}
</style>
</head>

</div></div>

function prodDe(m,pn){ return vivosDe(m).filter(function(p){ return p.parte===pn; }).reduce(function(s,p){ return s+(Number(p.qty)||0); },0); }
function esCB(x){ return /^CB_/.test(x.k); }
// Chip Board ranurado y virgen se SUMAN (el virgen se ranura en VC); los demás materiales se toman por mínimo
function capDe(c){
  var pend=c.pendiente||0, ms=c.materiales||[];
  if(!ms.length) return c.listo ? pend : 0;
  var cb=ms.filter(esCB), otros=ms.filter(function(x){ return !esCB(x); });
  var caps=otros.map(function(x){ return x.disp||0; });
  if(cb.length) caps.push(cb.reduce(function(s,x){ return s+(x.disp||0); },0));
  return Math.min.apply(null,caps);
}
function faltantes(c){
  var ms=c.materiales||[], out=ms.filter(function(x){ return !esCB(x) && x.e==='no'; }).map(function(x){ return matLabel(x.k); });
  var cb=ms.filter(esCB);
  if(cb.length && cb.every(function(x){ return !x.disp; })) out.push(matLabel(cb[0].k));
  return out;
}
function chips(c,maq){

}

function recomendada(lista){
  return lista.slice().sort(function(a,b){
    var fa=a.c.fecha||'9999', fb=b.c.fecha||'9999'; if(fa!==fb) return fa<fb?-1:1;
    var pa=a.c.prioridad||999, pb=b.c.prioridad||999; if(pa!==pb) return pa-pb;
    var ca=a.cap>=a.pend?1:0, cb=b.cap>=b.pend?1:0; if(ca!==cb) return cb-ca;
    return b.pend-a.pend;
  })[0];
}
function razonDe(f){ return t('envio')+' '+fechaEnvio(f.c.fecha)+' · '+t('prio')+' '+(f.c.prioridad||'—'); }
function calcMaq(m){
  var cola=colaDe(m);
  var filas=cola.map(function(c){
    var prod=prodDe(m,c.pn), target=(c.pendiente||0)+prod, pend=Math.max(0,target-prod);
    return { c:c, prod:prod, target:target, pend:pend, pct: target ? Math.min(100,Math.round(prod*100/target)) : 0, cap:capDe(c), corre:false, confirmado:false };
  });
  var runL=filas.filter(function(f){ return f.pend>0 && f.c.listo; });
  var waitL=filas.filter(function(f){ return f.pend>0 && !f.c.listo; });
  var doneL=filas.filter(function(f){ return f.pend===0; });
  runL.forEach(function(f,i){ f.orden=i+1; });
  // Qué parpadea: lo que confirmó el gerente (modal en Pallets de línea); si no hay confirmación,
  // el primero de "Se pueden correr". Si terminaron la corrida (pn vacío) no parpadea nada.
  var conf=confDe(m), terminada=!!(conf && !conf.pn);
  var idx=-1, razon='';
  if(conf && conf.pn){ runL.forEach(function(f,i){ if(idx<0 && f.c.pn===conf.pn) idx=i; }); }
  if(idx>=0){ runL[idx].corre=true; runL[idx].confirmado=true; }
  else if(!terminada && runL.length){ var rc=recomendada(runL); rc.corre=true; razon=razonDe(rc); }
  return { m:m, filas:filas, runL:runL, waitL:waitL, doneL:doneL, conf:(idx>=0?conf:null), razon:razon };
}

function ajustarPantalla(){
  var wrap=document.querySelector('.wrap'); if(!wrap) return;
  var z=zoomActual(); wrap.style.zoom=z;
  var pct=document.getElementById('btnZoomPct'); if(pct){ pct.textContent=Math.round(z*100)+'%'; pct.title=t('zoomReset'); }
  document.getElementById('btnZoomMenos').title=t('zoomMenos'); document.getElementById('btnZoomMas').title=t('zoomMas');
  ajustarTabla();
}
function ajustarTabla(){
  var w=document.getElementById('tblMain'); if(!w) return;
  w.style.maxHeight='';
  var r=w.getBoundingClientRect();
  var ratio=(w.offsetHeight>0&&r.height>0)?r.height/w.offsetHeight:zoomActual();
  var pie=document.getElementById('foot'), altoPie=pie?pie.getBoundingClientRect().height:0;
  var libre=window.innerHeight-r.top-altoPie-30;
  w.style.maxHeight=Math.floor(Math.max(220,libre)/(ratio||1))+'px';
}
function cambiarZoom(d){
  var z=d===0?1:Math.min(3,Math.max(0.5,Math.round((zoomActual()+d)*10)/10));
  try{localStorage.setItem(ZOOM_KEY,z);}catch(e){}
  ajustarPantalla();
}
window.addEventListener('resize',ajustarPantalla);


// ===== PICK LIST (almacén) — todas las máquinas =====
// Solo lo que se puede correr (⚡), cantidad = lo que alcanza el material. 1 pieza = 1 de cada material.
// Chip Board: primero el ranurado que ya hay; lo que falte sale de virgen (que pasa por VC a ranurarse).
function entregaTxt(dias){
  if(dias<=0) return t('pkYa');
  var dd=Math.round(dias), d=new Date(); d.setDate(d.getDate()+dd);
  return '≈ '+(dd===0?t('pkHoy'):(dd===1?t('pkManana'):t('dias')[d.getDay()]+' '+fechaCorta(d)));
}
function datosPick(){
  var maqs=[], resumen={};
  MAQS.forEach(function(m){
    var cm=calcMaq(m), acum=0, items=[];
    cm.runL.forEach(function(f){
      var c=f.c, cant=Math.min(f.cap,f.pend), antes=acum; acum+=(c.dias||0);
      if(cant<=0) return;
      var mats=[], ms=c.materiales||[];
      ms.filter(function(x){ return !esCB(x); }).forEach(function(x){ mats.push({k:x.k,pn:x.pn,cant:cant,nota:''}); });
      var resto=cant;
      ms.filter(esCB).sort(function(a,b){ return /_R$/.test(b.k)-/_R$/.test(a.k); }).forEach(function(x){
        var q=Math.min(x.disp||0,resto); if(q<=0) return; resto-=q;
        mats.push({k:x.k,pn:x.pn,cant:q,nota:(/_V$/.test(x.k)&&m.indexOf('VC')!==0)?t('pkVC'):''});
      });
      var mods=c.modelos||[c.sm];
      mats.forEach(function(x){
        var key=x.pn||x.k, r=resumen[key]||(resumen[key]={pn:x.pn||'—',desc:matLabel(x.k),cant:0,modelos:[],maqs:[]});
        r.cant+=x.cant; mods.forEach(function(md){ if(r.modelos.indexOf(md)<0) r.modelos.push(md); }); if(r.maqs.indexOf(m)<0) r.maqs.push(m);
      });
      items.push({orden:f.orden,modelos:mods,pn:c.pn,fecha:c.fecha,cant:cant,pend:f.pend,entrega:entregaTxt(antes),mats:mats});
    });
    if(items.length) maqs.push({m:m,items:items});
  });
  return { maqs:maqs, resumen:Object.keys(resumen).sort().map(function(k){ return resumen[k]; }) };
}
function imprimirPickList(){
  if(!plan||!plan.colas){ alert(t('sinDatosExp')); return; }
  var dp=datosPick(), ahora=new Date();
  var pubMs=plan.publicadoMs||Date.parse(plan.publicadoEn);
  var pub=pubMs?new Date(pubMs).toLocaleString(t('loc')):'—';
  var h='<div class="ph"><div><h2>'+t('pkTitulo')+'</h2><div class="pinfo">'+t('pkPlan')+': '+pub+' · '+t('impreso')+': '+ahora.toLocaleString(t('loc'))+'</div></div>'+
    '<div class="firmas">'+t('pkPreparo')+': ________________<br>'+t('pkEntrego')+': ________________<br>'+t('pkRecibio')+': ________________</div></div>';
  if(!dp.maqs.length) h+='<p>'+t('pkNada')+'</p>';
  dp.maqs.forEach(function(g){
    h+='<div class="mh" style="background:#eee"><span>'+esc(g.m)+'</span></div>';
    g.items.forEach(function(it){
      h+='<div class="mh"><span><span class="pn">'+it.orden+'</span>'+esc(it.modelos.slice(0,3).join(', '))+(it.modelos.length>3?' +'+(it.modelos.length-3):'')+' · '+esc(it.pn)+(it.fecha?' · '+t('envio')+' '+fechaEnvio(it.fecha):'')+'</span>'+
        '<span>'+t('pkPrep')+': '+n(it.cant)+' '+t('pzas')+' · '+t('pkEntregar')+': '+it.entrega+'</span></div>';
      h+='<table><tr><th style="width:20%">'+t('pkMaterial')+'</th><th style="width:15%">'+t('pkPN')+'</th><th class="r" style="width:10%">'+t('pkCant')+'</th><th>'+t('pkNota')+'</th><th style="width:5%">'+t('pkPrepChk')+'</th><th style="width:5%">'+t('pkEntrChk')+'</th></tr>';
      it.mats.forEach(function(x){ h+='<tr><td>'+esc(matLabel(x.k))+'</td><td><b>'+esc(x.pn||'—')+'</b></td><td class="r"><b>'+n(x.cant)+'</b></td><td class="nota">'+esc(x.nota)+'</td><td><span class="box"></span></td><td><span class="box"></span></td></tr>'; });
      h+='</table>';
    });
  });
  if(dp.resumen.length){
    h+='<div class="res"><h3>'+t('pkResumen')+'</h3><table><tr><th style="width:16%">'+t('pkPN')+'</th><th>'+t('pkDesc')+'</th><th class="r" style="width:10%">'+t('pkCant')+'</th><th>'+t('pkMaqs')+'</th><th>'+t('pkModelos')+'</th></tr>';
    dp.resumen.forEach(function(r){ h+='<tr><td><b>'+esc(r.pn)+'</b></td><td>'+esc(r.desc)+'</td><td class="r"><b>'+n(r.cant)+'</b></td><td>'+esc(r.maqs.join(', '))+'</td><td>'+esc(r.modelos.join(', '))+'</td></tr>'; });
    h+='</table></div>';
  }
  h+='<div class="pfoot">'+t('pkEstim')+'</div>';
  document.getElementById('pick').innerHTML=h;
  document.getElementById('pbTitulo').textContent=t('pkVista');
  document.getElementById('pbImprimir').textContent=t('pkImprimir');
  document.getElementById('pbCerrar').textContent=t('pkCerrar');
  document.body.classList.add('modo-pick','vista-pick');
  window.scrollTo(0,0);
}
function cerrarVistaPick(){ document.body.classList.remove('modo-pick','vista-pick'); }
window.addEventListener('afterprint',function(){ if(!document.body.classList.contains('vista-pick')) document.body.classList.remove('modo-pick'); });

// ===== EXCEL (todas las máquinas) =====
function exportarExcel(){
  if(!plan||!plan.colas||typeof XLSX==='undefined'){ alert(t('sinDatosExp')); return; }
  var ahora=new Date();
  var head=[t('maq'),t('orden'),t('modelo'),t('codigo'),t('envio'),t('target'),t('prod'),t('pend'),t('avance')+' %',t('material'),t('estado'),t('seccion')];
  var matTxt=function(c){ return (c.materiales||[]).map(function(x){ return matLabel(x.k)+' '+(x.e==='ok'?'✓':(x.e==='parcial'?n(x.disp)+'/'+n(x.req):'✗ 0')); }).join(' · '); };
  var filas=[], tipos=[];
  MAQS.forEach(function(m){
    var cm=calcMaq(m);
    [['run',cm.runL],['wait',cm.waitL],['done',cm.doneL]].forEach(function(g){
      g[1].forEach(function(f){
        var c=f.c, est;
        if(g[0]==='run') est=t('listo')+' '+(f.cap>=f.pend?f.pend:f.cap+' '+t('de')+' '+f.pend);
        else if(g[0]==='wait'){ var fl=faltantes(c); est=fl.length?t('falta')+' '+fl.join(', '):t('sinDatos'); }
        else est=t('completo');
        filas.push([m,g[0]==='run'?f.orden:(g[0]==='done'?'✓':'—'),(c.modelos||[c.sm]).join(', '),c.pn,fechaEnvio(c.fecha),f.target,f.prod,f.pend,f.pct,matTxt(c),est,t(g[0])]);
        tipos.push(g[0]);
      });
    });
  });
  var pubMs=plan.publicadoMs||Date.parse(plan.publicadoEn);
  var titulo=[[t('title')],[t('pkPlan')+': '+(pubMs?new Date(pubMs).toLocaleString(t('loc')):'—')],[t('impreso')+': '+ahora.toLocaleString(t('loc'))],[]];
  var ws=XLSX.utils.aoa_to_sheet(titulo.concat([head]).concat(filas));
  var r0=titulo.length;
  var borde={top:{style:'thin',color:{rgb:'BBBBBB'}},bottom:{style:'thin',color:{rgb:'BBBBBB'}},left:{style:'thin',color:{rgb:'BBBBBB'}},right:{style:'thin',color:{rgb:'BBBBBB'}}};
  var set=function(r,c,st){ var ref=XLSX.utils.encode_cell({r:r,c:c}); if(ws[ref]) ws[ref].s=st; };
  set(0,0,{font:{bold:true,sz:16}});
  head.forEach(function(_,c){ set(r0,c,{font:{bold:true},fill:{fgColor:{rgb:'EEEEEE'}},alignment:{horizontal:'center',vertical:'center',wrapText:true},border:borde}); });
  filas.forEach(function(fila,i){
    var r=r0+1+i, tipo=tipos[i];
    fila.forEach(function(v,c){
      var st={border:borde,alignment:{vertical:'center',horizontal:(c>=5&&c<=8)?'right':(c===1?'center':'left'),wrapText:c===9}};
      if(c>=5&&c<=7) st.numFmt='#,##0';
      if(c===0) st.font={bold:true,color:{rgb:'0B4FA3'}};
      if(c===7) st.font={bold:true};
      if(c===10) st.font={bold:true,color:{rgb:tipo==='wait'?'C00000':'0A7A3A'}};
      set(r,c,st);
    });
  });
  ws['!cols']=[10,6,26,16,10,10,11,11,10,60,28,18].map(function(w){ return {wch:w}; });
  ws['!merges']=[0,1,2].map(function(r){ return {s:{r:r,c:0},e:{r:r,c:11}}; });
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:r0,c:0},e:{r:r0+filas.length,c:11}})};
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,t('hojaPlan'));
  var dp=datosPick();
  if(dp.maqs.length){
    var ph=[t('maq'),t('orden'),t('modelo'),t('pkEntregar'),t('pkMaterial'),t('pkPN'),t('pkCant'),t('pkNota'),t('pkPrepChk'),t('pkEntrChk')];
    var pf=[];
    dp.maqs.forEach(function(g){ g.items.forEach(function(it){ it.mats.forEach(function(x){
      pf.push([g.m,it.orden,it.modelos.join(', '),it.entrega,matLabel(x.k),x.pn||'—',x.cant,x.nota,'','']);
    }); }); });
    var ws2=XLSX.utils.aoa_to_sheet([[t('pkTitulo')],[t('impreso')+': '+ahora.toLocaleString(t('loc'))],[],ph].concat(pf).concat([[],[t('pkResumen')],[t('pkPN'),t('pkDesc'),t('pkCant'),t('pkMaqs'),t('pkModelos')]])
      .concat(dp.resumen.map(function(r){ return [r.pn,r.desc,r.cant,r.maqs.join(', '),r.modelos.join(', ')]; })));
    var hs={font:{bold:true},fill:{fgColor:{rgb:'EEEEEE'}},border:borde,alignment:{horizontal:'center',wrapText:true}};
    ws2['A1'].s={font:{bold:true,sz:14}};
    ph.forEach(function(_,c){ ws2[XLSX.utils.encode_cell({r:3,c:c})].s=hs; });
    pf.forEach(function(fila,i){ fila.forEach(function(_,c){ var ref=XLSX.utils.encode_cell({r:4+i,c:c}); if(!ws2[ref]) ws2[ref]={t:'s',v:''}; ws2[ref].s={border:borde,font:{bold:c===5||c===6},numFmt:c===6?'#,##0':undefined}; }); });
    var rr=4+pf.length+1;
    var refT=XLSX.utils.encode_cell({r:rr,c:0}); if(ws2[refT]) ws2[refT].s={font:{bold:true,sz:12}};
    [0,1,2,3,4].forEach(function(c){ var ref=XLSX.utils.encode_cell({r:rr+1,c:c}); if(ws2[ref]) ws2[ref].s=hs; });
    ws2['!cols']=[10,7,26,28,26,16,10,30,7,7].map(function(w){ return {wch:w}; });
    XLSX.utils.book_append_sheet(wb,ws2,'Pick List');
  }
  var f=ahora.getFullYear()+'-'+String(ahora.getMonth()+1).padStart(2,'0')+'-'+String(ahora.getDate()).padStart(2,'0')+'_'+String(ahora.getHours()).padStart(2,'0')+String(ahora.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb,'Medio_Proceso_P4_'+f+'.xlsx');
}

function escucharPallets(){
  var f=hoyISO(); if(f===fechaPal && unsubPal) return; fechaPal=f;
  if(unsubPal) unsubPal();
  unsubPal=db.collection('pallets_medio').where('fecha','==',f).onSnapshot(function(s){
    pallets=s.docs.map(function(d){ return d.data(); }); pintar();
  }, function(e){ console.warn('pallets_medio:',e); });
}
var arrancado=false;
function arrancar(){
  if(arrancado) return; arrancado=true;
  unsubPlan=db.collection('bom_simulator_p4').doc('plan_piso_medio').onSnapshot(function(d){ plan=d.exists?d.data():null; pintar(); },
    function(e){ arrancado=false; console.warn('plan_piso_medio:',e); });
  db.collection('bom_simulator_p4').doc('linea_medio').onSnapshot(function(d){ lineaConf=(d.exists && d.data().maq) ? d.data().maq : {}; pintar(); }, function(e){ console.warn('linea_medio:',e); });
  escucharPallets(); ponerAuto(); pintar();
}
firebase.auth().onAuthStateChanged(function(u){
  if(!u){ arrancado=false; if(unsubPlan){unsubPlan();unsubPlan=null;} if(unsubPal){unsubPal();unsubPal=null;fechaPal='';} mostrarLogin(); return; }
  arrancar();
});
setInterval(function(){ escucharPallets(); pintar(); },60000);
ligarLangs();
mostrarLogin();
