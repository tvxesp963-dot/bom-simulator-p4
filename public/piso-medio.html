<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan de piso · Medio proceso P4</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-firestore-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-auth-compat.min.js"></script>
<style>
:root{--bg:#0a0e1a;--card:#111827;--card2:#0d1220;--border:#1f2a3d;--text:#e8edf5;--text2:#8b96a8;--text3:#5c6678;--green:#00e676;--red:#ff4d4d;--yellow:#f1c40f;--accent:#4da6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:16px}
.wrap{max-width:1600px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:26px;margin:0}
.langs{display:flex;gap:4px;align-items:center}
.langs button{background:#0d1220;border:1px solid var(--border);border-radius:6px;padding:4px 7px;cursor:pointer;transition:all .2s;opacity:.5}
.langs button:hover{opacity:.85;transform:scale(1.1)}
.langs button.on{opacity:1;border-color:var(--accent);background:var(--card);box-shadow:0 0 8px rgba(79,142,247,.3)}
.langs img{width:28px;height:20px;border-radius:3px;display:block}
.sub{color:var(--text2);font-size:15px;margin-bottom:14px}
.sub .old{color:var(--yellow);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.kpi .l{font-size:14px;color:var(--text2)}
.kpi .v{font-size:32px;font-weight:800;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.mq{background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px}
.mq .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.mq .nm{font-size:26px;font-weight:900;color:var(--accent)}
.mq .st{font-size:13px;color:var(--text2);text-align:right}
.mq .st b{color:var(--text);font-size:15px}
.it{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px;margin-bottom:8px}
.it.run{border-color:var(--accent);background:#102238}
.it.next{border:2px solid var(--green);background:#0b2a1b}
.num{min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;background:#1f2a3d;color:var(--text2)}
.it.run .num{background:var(--accent);color:#04203f}
.it.next .num{background:var(--green);color:#002b14}
.it.ok .num{background:var(--green);color:#002b14}
.it .t{flex:1;min-width:0}
.it .t .mdl{font-weight:800;color:var(--accent);font-size:16px}
.it .t .code{font-size:14px;font-weight:700;color:#fcd34d;letter-spacing:.3px}
.it .t .d{font-size:13px;color:var(--text2)}
.it .nx{font-size:11px;font-weight:900;color:var(--green);letter-spacing:.5px}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;white-space:nowrap}
.tag.ok{background:var(--yellow);color:#241c00}
.tag.run{background:var(--accent);color:#04203f}
.tag.no{background:#3a2a0f;color:#ffb84d;border:1px solid #6b4a14}
.empty{color:var(--text3);font-size:14px;padding:10px 2px}
.more{color:var(--text3);font-size:13px;text-align:center}
.foot{color:var(--text3);font-size:12px;margin-top:14px}
.login{max-width:340px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.login input{width:100%;margin:6px 0;padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px}
.login button{width:100%;margin-top:8px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#04203f;font-weight:800;font-size:15px;cursor:pointer}
.login .err{color:var(--red);font-size:13px;margin-top:8px}
.login a{display:block;margin-top:12px;color:var(--accent);font-size:13px;cursor:pointer;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;max-width:380px;width:100%}
.modal .box button.sec{background:transparent;border:1px solid var(--border);color:var(--text2);margin-top:6px}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="modal hide" id="rst"><div class="box">
  <div style="font-weight:800;margin-bottom:6px" id="rstT"></div>
  <div style="font-size:13px;color:var(--text2);margin-bottom:8px" id="rstS"></div>
  <div class="login" style="all:unset;display:block">
    <input id="rstE" type="email" style="width:100%;margin:6px 0;padding:11px;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px">
    <button id="rstB" style="width:100%;margin-top:8px;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#04203f;font-weight:800;font-size:15px;cursor:pointer"></button>
    <button class="sec" id="rstC" style="width:100%;margin-top:6px;padding:11px;border-radius:8px;cursor:pointer;background:transparent;border:1px solid var(--border);color:var(--text2)"></button>
    <div id="rstM" style="font-size:13px;margin-top:8px"></div>
  </div>
</div></div>

<script>
var T = {
  es:{title:'Plan de piso · Medio proceso',sub:'Cola por máquina según el plan del BOM Simulator',
      pub:function(m){return 'Plan publicado hace '+m+' min';},old:function(m){return '⚠ El plan lleva '+m+' min sin actualizarse';},
      nopub:'Todavía no hay plan de medio proceso publicado. Publícalo desde el BOM Simulator (Publicar TV).',
      kPal:'Pallets hoy',kPz:'Piezas hoy',kPend:'Pendientes de recibir en IMS',
      run:'Corriendo',listo:'Listo',nomat:'Sin material',next:'SIGUIENTE EN LA COLA',pend:'Pendiente',dias:'días',sinCola:'Sin cola en el plan publicado',
      mas:function(n){return '+'+n+' más en la cola';},palHoy:'pallets hoy',pzHoy:'pzas',
      login:'Inicia sesión para ver el plan',correo:'Correo',pass:'Contraseña',entrar:'Entrar',errLogin:'Correo o contraseña incorrectos',
      forgot:'¿Olvidaste tu contraseña? Da clic aquí para restablecerla',rstT:'Restablecer contraseña',rstS:'Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.',
      rstB:'Enviar enlace',rstC:'Cancelar',rstOk:'Listo. Revisa tu correo y también la carpeta de SPAM.',rstErr:'No se pudo enviar. Revisa el correo escrito.',
      foot:'Orden = plan de medio proceso del BOM Simulator (prioridad del Excel + material disponible) · Pallets en vivo del MES',loc:'es-MX'},
  en:{title:'Floor plan · In-process',sub:'Queue per machine from the BOM Simulator plan',
      pub:function(m){return 'Plan published '+m+' min ago';},old:function(m){return '⚠ Plan not updated for '+m+' min';},
      nopub:'No in-process plan has been published yet. Publish it from the BOM Simulator (Publish TV).',
      kPal:'Pallets today',kPz:'Pieces today',kPend:'Pending receipt in IMS',
      run:'Running',listo:'Ready',nomat:'No material',next:'NEXT IN QUEUE',pend:'Pending',dias:'days',sinCola:'No queue in the published plan',
      mas:function(n){return '+'+n+' more in queue';},palHoy:'pallets today',pzHoy:'pcs',
      login:'Sign in to view the plan',correo:'Email',pass:'Password',entrar:'Sign in',errLogin:'Wrong email or password',
      forgot:'Forgot your password? Click here to reset it',rstT:'Reset password',rstS:'Enter your email and we will send you a link to create a new password.',
      rstB:'Send link',rstC:'Cancel',rstOk:'Done. Check your email and also your SPAM folder.',rstErr:'Could not send. Check the email you typed.',
      foot:'Order = in-process plan from the BOM Simulator (Excel priority + available material) · Live pallets from MES',loc:'en-US'},
  ko:{title:'현장 계획 · 반제품',sub:'BOM Simulator 계획 기준 설비별 작업 순서',
      pub:function(m){return '계획 게시 '+m+'분 전';},old:function(m){return '⚠ 계획이 '+m+'분째 갱신되지 않음';},
      nopub:'게시된 반제품 계획이 아직 없습니다. BOM Simulator에서 게시하세요 (TV 게시).',
      kPal:'오늘 팔레트',kPz:'오늘 수량',kPend:'IMS 입고 대기',
      run:'작업 중',listo:'준비됨',nomat:'자재 부족',next:'다음 작업',pend:'잔량',dias:'일',sinCola:'게시된 계획에 작업 없음',
      mas:function(n){return '대기열 +'+n+'건';},palHoy:'오늘 팔레트',pzHoy:'개',
      login:'계획을 보려면 로그인하세요',correo:'이메일',pass:'비밀번호',entrar:'로그인',errLogin:'이메일 또는 비밀번호가 올바르지 않습니다',
      forgot:'비밀번호를 잊으셨나요? 여기를 눌러 재설정하세요',rstT:'비밀번호 재설정',rstS:'이메일을 입력하면 새 비밀번호를 만들 수 있는 링크를 보내드립니다.',
      rstB:'링크 보내기',rstC:'취소',rstOk:'완료. 이메일과 스팸 폴더도 확인하세요.',rstErr:'전송하지 못했습니다. 입력한 이메일을 확인하세요.',
      foot:'순서 = BOM Simulator 반제품 계획 (엑셀 우선순위 + 가용 자재) · MES 팔레트 실시간',loc:'ko-KR'}
};
var lang='es'; try{ lang=localStorage.getItem('pisoLang')||'es'; }catch(e){} if(!T[lang]) lang='es';
function t(k){ return T[lang][k]; }
function esc(s){ return String(s==null?'':s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }
function n(x){ return Math.round(x||0).toLocaleString('en-US'); }
var FLAGS={es:'mx',en:'us',ko:'kr'};
var MAQS=['S1','S2','S3','S4','S5','Zhongke','VC1','VC2'];
var MAX_ITEMS=6;

firebase.initializeApp({apiKey:"AIzaSyDbaC1kFX4ERhndtXDyHg8eCcexP5IjAuI",authDomain:"mes-production-esp.firebaseapp.com",projectId:"mes-production-esp"});
var db=firebase.firestore();
var plan=null, pallets=[], unsubPlan=null, unsubPal=null, fechaPal='';
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function pintarLangs(){
  return '<div class="langs">'+['es','en','ko'].map(function(l){
    return '<button class="'+(l===lang?'on':'')+'" data-l="'+l+'" title="'+l.toUpperCase()+'"><img src="https://flagcdn.com/w40/'+FLAGS[l]+'.png" alt="'+l.toUpperCase()+'"></button>';
  }).join('')+'</div>';
}
function ligarLangs(){
  document.querySelectorAll('.langs button').forEach(function(b){ b.onclick=function(){ lang=b.dataset.l; try{localStorage.setItem('pisoLang',lang);}catch(e){} if(firebase.auth().currentUser) pintar(); else mostrarLogin(); }; });
}

function mostrarLogin(){
  document.title=t('title');
  document.getElementById('app').innerHTML=
    '<div class="login"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>'+t('login')+'</b>'+pintarLangs()+'</div>'+
    '<input id="lgE" type="email" placeholder="'+t('correo')+'"><input id="lgP" type="password" placeholder="'+t('pass')+'">'+
    '<button id="lgB">'+t('entrar')+'</button><div class="err" id="lgErr"></div>'+
    '<a id="lgF">'+t('forgot')+'</a></div>';
  ligarLangs();
  document.getElementById('lgB').onclick=function(){
    var e=document.getElementById('lgE').value.trim(), p=document.getElementById('lgP').value;
    firebase.auth().signInWithEmailAndPassword(e,p).catch(function(){ document.getElementById('lgErr').textContent=t('errLogin'); });
  };
  document.getElementById('lgF').onclick=function(){
    document.getElementById('rstT').textContent=t('rstT'); document.getElementById('rstS').textContent=t('rstS');
    document.getElementById('rstB').textContent=t('rstB'); document.getElementById('rstC').textContent=t('rstC');
    document.getElementById('rstE').placeholder=t('correo'); document.getElementById('rstE').value=document.getElementById('lgE').value;
    document.getElementById('rstM').textContent=''; document.getElementById('rst').classList.remove('hide');
  };
}
document.getElementById('rstC').onclick=function(){ document.getElementById('rst').classList.add('hide'); };
document.getElementById('rstB').onclick=function(){
  var e=document.getElementById('rstE').value.trim(), m=document.getElementById('rstM');
  if(!e){ m.style.color='var(--red)'; m.textContent=t('rstErr'); return; }
  firebase.auth().sendPasswordResetEmail(e).then(function(){ m.style.color='var(--green)'; m.textContent=t('rstOk'); })
    .catch(function(){ m.style.color='var(--red)'; m.textContent=t('rstErr'); });
};

function colaDe(m){ return (plan && plan.colas && plan.colas[m]) ? plan.colas[m] : []; }
function enCurso(m){
  var l=pallets.filter(function(p){ return p.maquina===m && p.status!=='VOID'; }).sort(function(a,b){ return (b.horaMs||0)-(a.horaMs||0); });
  return l.length ? l[0] : null;
}

function pintar(){
  if(!firebase.auth().currentUser){ return; }
  document.title=t('title');
  var pubMs = plan ? (plan.publicadoMs || Date.parse(plan.publicadoEn)) : 0;
  var min = pubMs ? Math.max(0, Math.round((Date.now()-pubMs)/60000)) : null;
  var subTxt = min===null ? t('nopub') : (min>30 ? '<span class="old">'+t('old')(min)+'</span>' : t('pub')(min));
  var vivos = pallets.filter(function(p){ return p.status!=='VOID'; });
  var pz = vivos.reduce(function(s,p){ return s+(Number(p.qty)||0); },0);
  var pend = vivos.filter(function(p){ return p.status==='PENDING'; }).length;

  var cards = MAQS.map(function(m){
    var cola=colaDe(m), run=enCurso(m);
    var pm = vivos.filter(function(p){ return p.maquina===m; });
    var pzm = pm.reduce(function(s,p){ return s+(Number(p.qty)||0); },0);
    var esRun=function(c){ return run && c.pn===run.parte && (c.modelos||[c.sm]).indexOf(run.modelo)>=0; };
    var nextIdx=-1; cola.forEach(function(c,i){ if(nextIdx<0 && c.listo && !esRun(c)) nextIdx=i; });
    var items = cola.slice(0,MAX_ITEMS).map(function(c,i){
      var isRun=esRun(c), isNext=(i===nextIdx);
      var mods=(c.modelos||[c.sm]); var modTxt=mods.slice(0,2).join(', ')+(mods.length>2?' +'+(mods.length-2):'');
      var tag = isRun ? '<span class="tag run">'+t('run')+'</span>' : (c.listo ? '<span class="tag ok">'+t('listo')+'</span>' : '<span class="tag no">'+t('nomat')+'</span>');
      return '<div class="it '+(isRun?'run':isNext?'next':'')+'"><div class="num">'+(c.orden||i+1)+'</div><div class="t">'+
        (isNext?'<div class="nx">'+t('next')+'</div>':'')+
        '<div class="mdl">'+esc(modTxt)+'</div><div class="code">'+esc(c.pn)+'</div>'+
        '<div class="d">'+t('pend')+' '+n(c.pendiente)+(c.dias?' · ~'+c.dias+' '+t('dias'):'')+'</div></div>'+tag+'</div>';
    }).join('');
    var mas = cola.length>MAX_ITEMS ? '<div class="more">'+t('mas')(cola.length-MAX_ITEMS)+'</div>' : '';
    return '<div class="mq"><div class="h"><div class="nm">'+m+'</div><div class="st"><b>'+pm.length+'</b> '+t('palHoy')+'<br>'+n(pzm)+' '+t('pzHoy')+'</div></div>'+
      (items || '<div class="empty">'+t('sinCola')+'</div>')+mas+'</div>';
  }).join('');

  document.getElementById('app').innerHTML =
    '<div class="top"><h1>'+t('title')+'</h1>'+pintarLangs()+'</div>'+
    '<div class="sub">'+t('sub')+' · '+subTxt+'</div>'+
    '<div class="kpis"><div class="kpi"><div class="l">'+t('kPal')+'</div><div class="v" style="color:var(--accent)">'+vivos.length+'</div></div>'+
    '<div class="kpi"><div class="l">'+t('kPz')+'</div><div class="v" style="color:var(--green)">'+n(pz)+'</div></div>'+
    '<div class="kpi"><div class="l">'+t('kPend')+'</div><div class="v" style="color:#ffb84d">'+pend+'</div></div></div>'+
    '<div class="grid">'+cards+'</div><div class="foot">'+t('foot')+'</div>';
  ligarLangs();
}

function escucharPallets(){
  var f=hoyISO(); if(f===fechaPal && unsubPal) return; fechaPal=f;
  if(unsubPal) unsubPal();
  unsubPal=db.collection('pallets_medio').where('fecha','==',f).onSnapshot(function(s){
    pallets=s.docs.map(function(d){ return d.data(); }); pintar();
  }, function(e){ console.warn('pallets_medio:',e); });
}
var arrancado=false;
function arrancar(){
  if(arrancado) return; arrancado=true;
  unsubPlan=db.collection('bom_simulator_p4').doc('plan_piso_medio').onSnapshot(function(d){ plan=d.exists?d.data():null; pintar(); },
    function(e){ arrancado=false; console.warn('plan_piso_medio:',e); });
  escucharPallets();
  pintar();
}
firebase.auth().onAuthStateChanged(function(u){
  if(!u){ arrancado=false; if(unsubPlan){unsubPlan();unsubPlan=null;} if(unsubPal){unsubPal();unsubPal=null;fechaPal='';} mostrarLogin(); return; }
  arrancar();
});
setInterval(function(){ escucharPallets(); pintar(); }, 60000);
mostrarLogin();
</script>
</body>
</html>
