<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--bg:#0a0e1a;--card:#111827;--card2:#0d1220;--border:#1f2a3d;--text:#e8edf5;--text2:#8b96a8;--text3:#5c6678;--green:#00e676;--red:#ff4d4d;--yellow:#f1c40f;--accent:#4da6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:16px}
.wrap{max-width:1400px;margin:0 auto}
/* Modo pantalla (TV/monitor): todo se escala para caber completo, sin scroll */
body.fit{overflow:hidden;padding:0;height:100vh}
body.fit .wrap{width:1400px;max-width:none;margin:0;position:absolute;top:0;left:0;transform-origin:0 0;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:26px;margin:0}
.langs{display:flex;gap:4px;align-items:center}
.langs button{background:#0d1220;border:1px solid var(--border);border-radius:6px;padding:4px 7px;cursor:pointer;transition:all .2s;opacity:.5}
.langs button:hover{opacity:.85;transform:scale(1.1)}
.langs button.on{opacity:1;border-color:var(--accent);background:var(--card);box-shadow:0 0 8px rgba(79,142,247,.3)}
.langs img{width:28px;height:20px;border-radius:3px;display:block}
.sub{color:var(--text2);font-size:15px;margin-bottom:14px}
.sub .old{color:var(--yellow);font-weight:700}
.corte{display:inline-block;padding:2px 10px;border-radius:8px}
.corte.ambar{background:rgba(241,196,15,.18);color:var(--yellow);font-weight:800;font-size:20px;animation:corteBlink 1.2s ease-in-out infinite}
.corte.rojo{background:rgba(255,77,77,.22);color:var(--red);font-weight:900;font-size:24px;animation:corteBlink .6s ease-in-out infinite}
@keyframes corteBlink{0%,100%{opacity:1}50%{opacity:.25}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.kpi .l{font-size:14px;color:var(--text2)}
.kpi .v{font-size:32px;font-weight:800;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl th{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);text-align:left;padding:12px 10px;border-bottom:2px solid var(--border)}
.tbl td{padding:14px 10px;border-top:1px solid var(--border);font-size:20px}
.r,.tbl th.r{text-align:right}
.sep td{background:#151d2e;color:var(--text2);font-size:15px;font-weight:700;padding:8px 12px}
.num{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;background:var(--green);color:#002b14;font-weight:900;font-size:22px}
.num.wait{background:#1f2a3d;color:var(--text2);font-size:18px}
.mdl{font-weight:800;color:var(--accent)}
.code{font-size:12px;color:var(--text3)}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;margin:2px}
.ok{background:rgba(0,230,118,.15);color:var(--green)}
.no{background:rgba(255,77,77,.18);color:var(--red)}
.na{background:#1f2a3d;color:var(--text3)}
.bar{background:#1f2a3d;height:12px;border-radius:6px;min-width:90px}
.bar div{height:12px;border-radius:6px}
.est{font-weight:800;font-size:18px}
.done td{background:rgba(0,230,118,.07)}
.sep.sepdone td{background:rgba(0,230,118,.14);color:var(--green)}
.num.ok{background:rgba(0,230,118,.2);color:var(--green);border:2px solid var(--green)}
.prodok{color:var(--green);font-weight:900;font-size:22px}
.extra{display:block;font-size:13px;color:var(--green);font-weight:700}
.foot{color:var(--text3);font-size:13px;margin-top:10px}
.msg{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--text2);font-size:18px}
.login{max-width:360px;margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.login input{width:100%;padding:10px;margin:6px 0;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px}
.login button{width:100%;padding:10px;margin-top:8px;background:var(--accent);border:0;border-radius:8px;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:13px;margin-top:6px}
.acciones{display:flex;gap:6px;align-items:center;margin-right:8px}
.acciones button{background:#0d1220;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.acciones button:hover{border-color:var(--accent)}
.derecha{display:flex;align-items:center}
@page{size:letter landscape;margin:8mm}
#pick{display:none}
#pick{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;color:#000;background:#fff}
#pick .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
#pick h2{font-size:18px;margin:0}
#pick .pinfo{font-size:10px}
#pick .firmas{font-size:10px;line-height:2}
#pick .mh{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #000;padding:4px 8px;margin-top:8px;font-size:12px;font-weight:800;page-break-after:avoid}
#pick .pn{display:inline-flex;width:20px;height:20px;border:1.5px solid #000;border-radius:50%;align-items:center;justify-content:center;margin-right:6px;font-size:11px}
#pick table{width:100%;border-collapse:collapse;margin:2px 0 4px;page-break-inside:avoid}
#pick th{font-size:9px;text-align:left;border-bottom:1.5px solid #000;padding:3px 4px;text-transform:uppercase}
#pick td{font-size:11px;border-bottom:0.5px solid #aaa;padding:4px}
#pick .r{text-align:right}
#pick .box{display:inline-block;width:13px;height:13px;border:1.5px solid #000;border-radius:2px}
#pick .nota{font-size:10px;font-weight:700;text-decoration:underline}
#pick .res{margin-top:10px;border-top:2px solid #000;padding-top:4px;page-break-inside:avoid}
#pick .res h3{font-size:12px;margin:2px 0 4px}
#pick .pfoot{font-size:9px;color:#444;margin-top:6px}
@media print{
  /* Ahorro de tinta: solo negro/gris, sin fondos de color ni barras rellenas */
  :root{--bg:#fff;--card:#fff;--card2:#fff;--border:#999;--text:#000;--text2:#222;--text3:#555;--green:#000;--red:#000;--yellow:#000;--accent:#000}
  *{-webkit-print-color-adjust:economy;print-color-adjust:economy;animation:none!important;box-shadow:none!important;background:transparent!important;color:#000!important}
  body,body.fit{padding:0;overflow:visible;height:auto;filter:grayscale(100%)}
  body.fit .wrap,.wrap{transform:none!important;position:static;width:auto;max-width:none;padding:0}
  .acciones,.langs,.bar{display:none!important}
  h1{font-size:18px}.sub{font-size:11px;margin-bottom:6px}
  .kpis{gap:6px;margin-bottom:8px}.kpi{padding:6px 10px;border:1px solid #999}.kpi .l{font-size:10px}.kpi .v{font-size:18px}
  .tbl{border:1px solid #666}.tbl th{font-size:9px;padding:4px 5px;border-bottom:2px solid #000}
  .tbl td{font-size:11px;padding:3px 5px;border-top:1px solid #ccc}
  tr{page-break-inside:avoid}
  .sep td{font-size:10px;padding:4px 6px;border-top:2px solid #000;border-bottom:1px solid #000;text-transform:uppercase}
  .num{width:22px;height:22px;font-size:12px;border:1.5px solid #000}
  .mdl{font-size:12px}.code{font-size:8px;color:#444!important}
  .chip{font-size:9px;padding:0 3px;margin:0 1px;border:1px solid #bbb;font-weight:400}
  .chip.no{border:1.5px solid #000;font-weight:800;text-decoration:underline}
  .chip.na{color:#888!important;border-style:dashed}
  .pm{display:inline!important}
  .est{font-size:11px}.prodok{font-size:13px}.extra{font-size:9px}
  .corte.ambar,.corte.rojo{font-size:11px}
  .foot{font-size:9px}
  body.modo-pick .wrap{display:none!important}
  body.modo-pick #pick{display:block!important}
}
@media (max-width:800px){.tbl td{font-size:15px;padding:10px 6px}.hide-sm{display:none}.kpi .v{font-size:24px}h1{font-size:20px}}
</style>
</head>

var lang = 'es';
try { lang = localStorage.getItem('pisoLang') || 'es'; } catch (e) {}
if (!T[lang]) lang = 'es';
function t(k){ return T[lang][k]; }
function esc(s){ return String(s == null ? '' : s).replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function fechaCorta(d){ return d.toLocaleDateString(t('loc'), {day:'2-digit', month:'short'}); }
function fechaEnvio(f){ if (!f) return '—'; var d = new Date(f + 'T00:00:00'); return isNaN(d) ? '—' : fechaCorta(d); }
function n(x){ return Math.round(x || 0).toLocaleString(t('loc')); }

document.querySelectorAll('.langs button').forEach(function(b){
  b.onclick = function(){ lang = b.dataset.l; try { localStorage.setItem('pisoLang', lang); } catch (e) {} pintar(); };
});

// ===== Cortes de envío (misma lógica que el BOM Simulator) =====
var cortesEspeciales = [];
function aplicarCorteEspecial(c){ var m = cortesEspeciales.find(function(x){ return x.original === c.getTime(); }); return m ? new Date(m.nuevo) : c; }
function generarCortesFinales(centro){
  var out = [];
  for (var i = -21; i <= 21; i++) {
    var dia = new Date(centro); dia.setDate(dia.getDate() + i); dia.setHours(0,0,0,0);
    var dow = dia.getDay(), c;
    if (dow === 3) { c = new Date(dia); c.setHours(15,30,0,0); out.push(aplicarCorteEspecial(c)); }
    else if (dow === 6) { c = new Date(dia); c.setHours(11,0,0,0); out.push(aplicarCorteEspecial(c)); }
  }
  return out.sort(function(a,b){ return a - b; });
}
function proximoCorte(desde){ var cs = generarCortesFinales(desde); for (var i = 0; i < cs.length; i++) if (cs[i] > desde) return cs[i]; return null; }

// ===== Firebase (mismo proyecto que BOM Simulator) =====
var cfg = {apiKey:"AIzaSyDbaC1kFX4ERhndtXDyHg8eCcexP5IjAuI",authDomain:"mes-production-esp.firebaseapp.com",projectId:"mes-production-esp"};
firebase.initializeApp(cfg);
var db = firebase.firestore();
var plan = null;            // documento publicado
var producidoVivo = null;   // { modelo: piezas } desde ShipQR
var arrancado = false, unsubPlan = null;

function mostrarLogin(){
  document.getElementById('app').innerHTML =
    '<div class="login"><div style="font-weight:700;margin-bottom:8px">' + t('login') + '</div>' +
    '<input id="lgE" type="email" placeholder="' + t('correo') + '"><input id="lgP" type="password" placeholder="' + t('pass') + '">' +
    '<button id="lgB">' + t('entrar') + '</button><div class="err" id="lgErr"></div></div>';
  document.getElementById('lgB').onclick = function(){
    var e = document.getElementById('lgE').value.trim(), p = document.getElementById('lgP').value;
    firebase.auth().signInWithEmailAndPassword(e, p).catch(function(){ document.getElementById('lgErr').textContent = t('errLogin'); });
  };
}

function errorLectura(e){
  console.warn('Error leyendo Firebase:', e);
  if (e && e.code === 'permission-denied' && !firebase.auth().currentUser) mostrarLogin();
}

function arrancar(){
  if (arrancado) return; arrancado = true;
  unsubPlan = db.collection('bom_simulator_p4').doc('plan_piso').onSnapshot(function(doc){
    plan = doc.exists ? doc.data() : { modelos: [] };
    pintar();
  }, function(e){ arrancado = false; errorLectura(e); });
  db.collection('bom_simulator_p4').doc('cortes_especiales').onSnapshot(function(doc){
    cortesEspeciales = (doc.exists && Array.isArray(doc.data().lista)) ? doc.data().lista : [];
    pintar();
  }, function(){});
  leerProducido();
}

// Producido = pallets GH90 en ShipQR que aún NO están SHIPPED y no son REMPLAZO
// (misma regla que "Traer de ShipQR" en el BOM Simulator).
function leerProducido(){
  db.collection('shipqr_pallets').get().then(function(snap){
    var pm = {};
    snap.forEach(function(doc){
      var d = doc.data();
      if (d.status === 'SHIPPED' || d.motivo === 'REMPLAZO') return;
      var modelo = (d.modelo || '').trim();
      if (!modelo || !(d.part_number || '').toUpperCase().startsWith('GH90')) return;
      pm[modelo] = (pm[modelo] || 0) + (Number(d.quantity) || 0);
    });
    producidoVivo = pm;
    pintar();
  }).catch(function(e){ console.warn('No se pudo leer ShipQR, se usa el Producido publicado:', e); });
}

firebase.auth().onAuthStateChanged(function(){ arrancado = false; if (unsubPlan) { unsubPlan(); unsubPlan = null; } arrancar(); });
setInterval(leerProducido, 5 * 60 * 1000);   // Producido cada 5 min
setInterval(pintar, 60 * 1000);              // reloj del corte
setInterval(function(){ location.reload(); }, 6 * 60 * 60 * 1000); // recarga completa cada 6 h (TV encendida todo el día)

// ===== Pintar pantalla =====
function pintar(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.getElementById('tTitle').textContent = t('title');
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  document.getElementById('foot').textContent = t('foot');

  // Encabezado: corte + publicado
  var ahora = new Date(), sub = '';
  var pc = proximoCorte(ahora);
  if (pc) {
    var h12 = pc.getHours() % 12 || 12, ampm = pc.getHours() >= 12 ? 'pm' : 'am';
    var ms = pc - ahora, dd = Math.floor(ms / 864e5), hh = Math.floor(ms % 864e5 / 36e5), mm = Math.floor(ms % 36e5 / 6e4);
    var falta = (dd ? dd + ' ' + t('d') + ' ' : '') + hh + ' ' + t('h') + (dd ? '' : ' ' + mm + ' ' + t('m'));
    // Parpadea al acercarse el corte: menos de 4 h = amarillo, menos de 1 h = rojo y más rápido
    var cls = ms <= 36e5 ? ' rojo' : (ms <= 4 * 36e5 ? ' ambar' : '');
    sub += '<span class="corte' + cls + '">⏰ ' + t('corte') + ': ' + t('dias')[pc.getDay()] + ' ' + fechaCorta(pc) + ' ' + h12 + ':' + String(pc.getMinutes()).padStart(2,'0') + ampm + ' · ' + t('faltan') + ' <b>' + falta + '</b></span>';
  }
  if (plan && plan.publicadoEn) {
    var pub = new Date(plan.publicadoEn), viejo = (ahora - pub) > 12 * 36e5;
    sub += ' · ' + t('publicado') + ': ' + pub.toLocaleString(t('loc'), {weekday:'short', hour:'numeric', minute:'2-digit'}) +
           (viejo ? ' <span class="old">⚠ ' + t('viejo') + '</span>' : '');
  }
  document.getElementById('sub').innerHTML = sub;

  var app = document.getElementById('app');
  if (!plan) { app.innerHTML = '<div class="msg">' + t('loading') + '</div>'; return; }
  var mods = Array.isArray(plan.modelos) ? plan.modelos : [];
  if (!mods.length) { app.innerHTML = '<div class="msg">' + t('vacio') + '</div>'; return; }

  // Calcular con Producido en vivo
  var filas = mods.map(function(m){
    var prod = (producidoVivo && producidoVivo[m.sm] !== undefined) ? producidoVivo[m.sm] : (m.producido || 0);
    if (producidoVivo && producidoVivo[m.sm] === undefined) prod = 0;
    var pend = Math.max(0, (m.target || 0) - prod);
    return { m: m, prod: prod, pend: pend, pct: m.target ? Math.min(100, Math.round(prod * 100 / m.target)) : 0 };
  });
  var tot = filas.reduce(function(a, f){ a.t += f.m.target || 0; a.p += Math.min(f.prod, f.m.target || 0); return a; }, {t:0, p:0});

  var run = filas.filter(function(f){ return f.pend > 0 && f.m.orden; }).sort(function(a,b){ return a.m.orden - b.m.orden; });
  var wait = filas.filter(function(f){ return f.pend > 0 && !f.m.orden; }).sort(function(a,b){ return (a.m.prioridad||999) - (b.m.prioridad||999); });
  var done = filas.filter(function(f){ return f.pend === 0; });
  window._ultimo = { run: run, wait: wait, done: done, tot: tot };

  var kp = function(l, v, color){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v"' + (color ? ' style="color:' + color + '"' : '') + '>' + v + '</div></div>'; };
  var avTot = tot.t ? Math.round(tot.p * 100 / tot.t) : 0;
  var html = '<div class="kpis">' + kp(t('target'), n(tot.t)) + kp(t('prod'), n(tot.p)) + kp(t('pend'), n(tot.t - tot.p)) +
             kp(t('avance'), avTot + '%', avTot >= 100 ? 'var(--green)' : '') + '</div>';

  var chips = function(mat){
    return ['Strip','Top','Bot','Bundle'].map(function(k){
      var v = mat ? mat[k] : null;
      var cls = v === true ? 'ok' : (v === false ? 'no' : 'na');
      return '<span class="chip ' + cls + '"><span class="pm" style="display:none">' + (v === true ? '✓' : (v === false ? '✗' : '–')) + ' </span>' + k + '</span>';
    }).join('');
  };
  var bar = function(f, color){ return '<div class="bar"><div style="width:' + f.pct + '%;background:' + color + '"></div></div><div class="code">' + f.pct + '%</div>'; };
  var fila = function(f, tipo){
    var m = f.m, num, est;
    if (tipo === 'run') {
      num = '<span class="num">' + m.orden + '</span>';
      var cap = m.cap || 0;
      est = '<span class="est" style="color:' + (cap >= f.pend ? 'var(--green)' : 'var(--yellow)') + '">⚡ ' + t('listo') + ' ' +
            (cap >= f.pend ? n(f.pend) : n(cap) + ' ' + t('de') + ' ' + n(f.pend)) + '</span>';
    } else {
      num = '<span class="num wait">⏳</span>';
      var faltan = ['Strip','Top','Bot','Bundle'].filter(function(k){ return m.materiales && m.materiales[k] === false; });
      est = '<span class="est" style="color:var(--red)">' + (faltan.length ? t('falta') + ' ' + faltan.join(', ') : t('sinDatos')) + '</span>';
    }
    return '<tr><td>' + num + '</td><td><div class="mdl">' + esc(m.sm) + '</div><div class="code">' + esc(m.code || '') + '</div></td>' +
      '<td style="white-space:nowrap">' + fechaEnvio(m.fecha) + '</td>' +
      '<td class="r hide-sm">' + n(m.target) + '</td><td class="r">' + n(f.prod) + '</td><td class="r" style="font-weight:800">' + n(f.pend) + '</td>' +
      '<td class="hide-sm" style="width:14%">' + bar(f, tipo === 'run' ? 'var(--green)' : '#5c6678') + '</td>' +
      '<td>' + chips(m.materiales) + '</td><td>' + est + '</td></tr>';
  };

  html += '<table class="tbl"><thead><tr><th style="width:60px">' + t('orden') + '</th><th>' + t('modelo') + '</th><th>' + t('envio') + '</th><th class="r hide-sm">' + t('target') + '</th><th class="r">' + t('prod') +
          '</th><th class="r">' + t('pend') + '</th><th class="hide-sm">' + t('avance') + '</th><th>' + t('material') + '</th><th>' + t('estado') + '</th></tr></thead><tbody>';
  if (run.length) html += '<tr class="sep"><td colspan="9">⚡ ' + t('run') + '</td></tr>' + run.map(function(f){ return fila(f, 'run'); }).join('');
  if (wait.length) html += '<tr class="sep"><td colspan="9">⏳ ' + t('wait') + '</td></tr>' + wait.map(function(f){ return fila(f, 'wait'); }).join('');
  if (done.length) html += '<tr class="sep sepdone"><td colspan="9">✓ ' + t('done') + '</td></tr>' + done.map(function(f){
    var extra = f.prod - (f.m.target || 0);
    return '<tr class="done"><td><span class="num ok">✓</span></td><td><div class="mdl">' + esc(f.m.sm) + '</div><div class="code">' + esc(f.m.code || '') + '</div></td>' +
           '<td style="white-space:nowrap">' + fechaEnvio(f.m.fecha) + '</td><td class="r hide-sm">' + n(f.m.target) + '</td>' +
           '<td class="r"><span class="prodok">' + n(f.prod) + '</span>' + (extra > 0 ? '<span class="extra">+' + n(extra) + '</span>' : '') + '</td>' +
           '<td class="r" style="color:var(--green);font-weight:800">0</td><td class="hide-sm">' + bar(f, 'var(--green)') + '</td><td></td>' +
           '<td><span class="est" style="color:var(--green)">✓ ' + t('completo') + '</span></td></tr>';
  }).join('');
  html += '</tbody></table>';
  app.innerHTML = html;
  ajustarPantalla();
}
// Ajusta todo al tamaño de la pantalla donde se despliega (TV, monitor, laptop).
// En celular (pantalla angosta) no se escala: se deja con scroll normal.
function ajustarPantalla(){
  var wrap = document.querySelector('.wrap');
  if (window.innerWidth < 800) { document.body.classList.remove('fit'); wrap.style.transform = ''; return; }
  document.body.classList.add('fit');
  wrap.style.transform = 'none';
  var w = wrap.scrollWidth, h = wrap.scrollHeight;
  var s = Math.min(window.innerWidth / w, window.innerHeight / h, 3);
  var left = Math.max(0, (window.innerWidth - w * s) / 2);
  wrap.style.transform = 'translate(' + left + 'px,0) scale(' + s + ')';
}
window.addEventListener('resize', ajustarPantalla);
document.querySelectorAll('.langs img').forEach(function(img){ img.addEventListener('load', ajustarPantalla); });
// ===== PDF (impresión) =====
// Abre la ventana de impresión con formato de hoja (fondo blanco, horizontal).
// Ahí se elige "Guardar como PDF" o la impresora.
function imprimirPDF(){ window.print(); }
window.addEventListener('afterprint', ajustarPantalla);

// ===== PICK LIST (almacén) =====
// Solo los modelos que se pueden correr (orden 1, 2, 3…), cantidad = lo que está Listo.
// Cada material (Strip/Top/Bot/Bundle) se pide 1 por pieza, igual que el Pick List del BOM Simulator.
function datosPickList(){
  var u = window._ultimo;
  if (!u) return null;
  var capDia = (plan && plan.capacidadDia) || 13000, capSab = (plan && plan.capacidadSabado) || 0;
  var acumulado = 0, faltanPN = false;
  var modelos = u.run.map(function(f){
    var m = f.m, cant = Math.min(m.cap || 0, f.pend);
    var inicio = acumulado; acumulado += cant;
    var mats = ['Strip','Top','Bot','Bundle'].map(function(k){
      var pn = m.pn ? m.pn[k] : '';
      var usa = m.materiales && m.materiales[k] !== null && m.materiales[k] !== undefined;
      if (usa && !pn) faltanPN = true;
      return { k: k, pn: pn || '', desc: (m.desc && m.desc[k]) || '', usa: usa, parcial: usa && m.materiales[k] === false };
    }).filter(function(x){ return x.usa; });
    return { orden: m.orden, sm: m.sm, code: m.code || '', fecha: m.fecha, cant: cant, pend: f.pend, inicio: inicio, mats: mats };
  });
  var resumen = {};
  modelos.forEach(function(md){ md.mats.forEach(function(x){
    var key = x.pn || (x.k + ' · ' + md.sm);
    if (!resumen[key]) resumen[key] = { pn: x.pn || '—', desc: x.desc, cant: 0, modelos: [] };
    resumen[key].cant += md.cant; resumen[key].modelos.push(md.sm);
  }); });
  return { modelos: modelos, resumen: Object.keys(resumen).sort().map(function(k){ return resumen[k]; }), capDia: capDia, capSab: capSab, faltanPN: faltanPN };
}

// Día estimado en que la línea llega a este modelo, según piezas antes de él y capacidad por día.
function entregaEstimada(inicio, capDia, capSab){
  if (inicio <= 0) return t('pkYa');
  var d = new Date(); d.setHours(0,0,0,0);
  var hoy = new Date(d), restante = inicio;
  for (var i = 0; i < 60; i++) {
    var cap = d.getDay() === 0 ? 0 : (d.getDay() === 6 ? capSab : capDia);
    if (restante < cap) break;
    restante -= cap; d.setDate(d.getDate() + 1);
  }
  var dias = Math.round((d - hoy) / 864e5);
  var cuando = dias === 0 ? t('pkHoy') : (dias === 1 ? t('pkManana') : t('dias')[d.getDay()] + ' ' + fechaCorta(d));
  return '≈ ' + cuando + ' · ' + t('pkDespues') + ' ' + n(inicio) + ' ' + t('pzas');
}

function imprimirPickList(){
  var dp = datosPickList();
  if (!dp) { alert(t('sinDatosExp')); return; }
  var ahora = new Date();
  var pub = (plan && plan.publicadoEn) ? new Date(plan.publicadoEn).toLocaleString(t('loc')) : '—';
  var pc = proximoCorte(ahora);
  var corteTxt = pc ? t('dias')[pc.getDay()] + ' ' + fechaCorta(pc) + ' ' + pc.toLocaleTimeString(t('loc'), {hour:'numeric', minute:'2-digit'}) : '—';
  var h = '<div class="ph"><div><h2>' + t('pkTitulo') + '</h2><div class="pinfo">' + t('corte') + ': ' + corteTxt + ' · ' + t('pkPlan') + ': ' + pub +
          ' · ' + t('impreso') + ': ' + ahora.toLocaleString(t('loc')) + '</div></div>' +
          '<div class="firmas">' + t('pkPreparo') + ': ________________<br>' + t('pkEntrego') + ': ________________<br>' + t('pkRecibio') + ': ________________</div></div>';
  if (dp.faltanPN) h += '<div class="nota" style="margin:4px 0">⚠ ' + t('pkRepub') + '</div>';
  if (!dp.modelos.length) h += '<p>' + t('pkNada') + '</p>';
  dp.modelos.forEach(function(md){
    h += '<div class="mh"><span><span class="pn">' + md.orden + '</span>' + esc(md.sm) + ' · ' + esc(md.code) + (md.fecha ? ' · ' + t('envio') + ' ' + fechaEnvio(md.fecha) : '') + '</span>' +
         '<span>' + t('pkPrep') + ': ' + n(md.cant) + ' ' + t('pzas') + ' · ' + t('pkEntregar') + ': ' + entregaEstimada(md.inicio, dp.capDia, dp.capSab) + '</span></div>';
    h += '<table><tr><th style="width:9%">' + t('pkMaterial') + '</th><th style="width:15%">' + t('pkPN') + '</th><th>' + t('pkDesc') + '</th><th class="r" style="width:9%">' + t('pkCant') +
         '</th><th style="width:22%">' + t('pkNota') + '</th><th style="width:5%">' + t('pkPrepChk') + '</th><th style="width:5%">' + t('pkEntrChk') + '</th></tr>';
    md.mats.forEach(function(x){
      h += '<tr><td>' + x.k + '</td><td><b>' + esc(x.pn || '—') + '</b></td><td>' + esc(x.desc) + '</td><td class="r"><b>' + n(md.cant) + '</b></td><td class="nota">' +
           (x.parcial ? t('pkSolo') + ' ' + n(md.cant) + ' ' + t('de') + ' ' + n(md.pend) : '') + '</td><td><span class="box"></span></td><td><span class="box"></span></td></tr>';
    });
    h += '</table>';
  });
  if (dp.resumen.length) {
    h += '<div class="res"><h3>' + t('pkResumen') + '</h3><table><tr><th style="width:16%">' + t('pkPN') + '</th><th>' + t('pkDesc') + '</th><th class="r" style="width:10%">' + t('pkCant') + '</th><th>' + t('pkModelos') + '</th></tr>';
    dp.resumen.forEach(function(r){ h += '<tr><td><b>' + esc(r.pn) + '</b></td><td>' + esc(r.desc) + '</td><td class="r"><b>' + n(r.cant) + '</b></td><td>' + esc(r.modelos.join(', ')) + '</td></tr>'; });
    h += '</table></div>';
  }
  h += '<div class="pfoot">' + t('pkEstim') + ' (' + n(dp.capDia) + '/' + t('d') + ')</div>';
  document.getElementById('pick').innerHTML = h;
  document.body.classList.add('modo-pick');
  window.print();
}
window.addEventListener('afterprint', function(){ document.body.classList.remove('modo-pick'); });

// ===== EXCEL =====
function exportarExcel(){
  var u = window._ultimo;
  if (!u || typeof XLSX === 'undefined') { alert(t('sinDatosExp')); return; }
  var ahora = new Date();
  var head = [t('orden'), t('modelo'), t('codigo'), t('envio'), t('target'), t('prod'), t('pend'), t('avance') + ' %', 'Strip', 'Top', 'Bot', 'Bundle', t('estado'), t('seccion')];
  var mat = function(m, k){ var v = m.materiales ? m.materiales[k] : null; return v === true ? '✓' : (v === false ? '✗' : 'N/A'); };
  var estado = function(f, tipo){
    if (tipo === 'run') { var cap = f.m.cap || 0; return t('listo') + ' ' + (cap >= f.pend ? f.pend : cap + ' ' + t('de') + ' ' + f.pend); }
    if (tipo === 'wait') { var fl = ['Strip','Top','Bot','Bundle'].filter(function(k){ return f.m.materiales && f.m.materiales[k] === false; }); return fl.length ? t('falta') + ' ' + fl.join(', ') : t('sinDatos'); }
    return t('completo') + (f.prod > (f.m.target || 0) ? ' (+' + (f.prod - f.m.target) + ')' : '');
  };
  var filas = [], tipos = [];
  [['run', u.run], ['wait', u.wait], ['done', u.done]].forEach(function(g){
    g[1].forEach(function(f){
      filas.push([g[0] === 'run' ? f.m.orden : (g[0] === 'done' ? '✓' : '—'), f.m.sm, f.m.code || '', fechaEnvio(f.m.fecha),
        f.m.target || 0, f.prod, f.pend, f.pct, mat(f.m,'Strip'), mat(f.m,'Top'), mat(f.m,'Bot'), mat(f.m,'Bundle'), estado(f, g[0]), t(g[0])]);
      tipos.push(g[0]);
    });
  });
  var titulo = [[t('title')], [document.getElementById('sub').textContent], [t('impreso') + ': ' + ahora.toLocaleString(t('loc'))],
    [t('target') + ': ' + u.tot.t + '   ' + t('prod') + ': ' + u.tot.p + '   ' + t('pend') + ': ' + (u.tot.t - u.tot.p) + '   ' + t('avance') + ': ' + (u.tot.t ? Math.round(u.tot.p * 100 / u.tot.t) : 0) + '%'], []];
  var ws = XLSX.utils.aoa_to_sheet(titulo.concat([head]).concat(filas));
  var r0 = titulo.length;
  var borde = { top:{style:'thin',color:{rgb:'BBBBBB'}}, bottom:{style:'thin',color:{rgb:'BBBBBB'}}, left:{style:'thin',color:{rgb:'BBBBBB'}}, right:{style:'thin',color:{rgb:'BBBBBB'}} };
  var set = function(r, c, st){ var ref = XLSX.utils.encode_cell({r:r, c:c}); if (ws[ref]) ws[ref].s = st; };
  set(0, 0, { font:{ bold:true, sz:16 } });
  head.forEach(function(_, c){ set(r0, c, { font:{ bold:true, color:{rgb:'000000'} }, fill:{ fgColor:{rgb:'EEEEEE'} }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, border: borde }); });
  var fondo = { run:'FFFFFF', wait:'FFFFFF', done:'FFFFFF' };
  filas.forEach(function(fila, i){
    var r = r0 + 1 + i, tipo = tipos[i];
    fila.forEach(function(v, c){
      var st = { border: borde, fill:{ fgColor:{ rgb: fondo[tipo] } }, alignment:{ vertical:'center', horizontal: (c >= 4 && c <= 7) ? 'right' : (c === 0 || (c >= 8 && c <= 11) ? 'center' : 'left') } };
      if (c >= 4 && c <= 6) st.numFmt = '#,##0';
      if (c === 1) st.font = { bold:true, color:{rgb:'0B4FA3'} };
      if (c === 6) st.font = { bold:true };
      if (c >= 8 && c <= 11) { st.font = { bold:true, color:{ rgb: v === '✓' ? '0A7A3A' : (v === '✗' ? 'C00000' : '777777') } }; }
      if (c === 12) st.font = { bold:true, color:{ rgb: tipo === 'wait' ? 'C00000' : (tipo === 'done' ? '0A7A3A' : '0A7A3A') } };
      if (c === 0) st.font = { bold:true, sz:12 };
      set(r, c, st);
    });
  });
  ws['!cols'] = [6, 22, 15, 10, 10, 11, 11, 10, 7, 7, 7, 8, 26, 18].map(function(w){ return { wch: w }; });
  ws['!merges'] = [0,1,2,3].map(function(r){ return { s:{r:r,c:0}, e:{r:r,c:13} }; });
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:r0,c:0}, e:{r:r0 + filas.length, c:13} }) };
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, t('hojaPlan'));
  var dp = datosPickList();
  if (dp && dp.modelos.length) {
    var ph = [t('orden'), t('modelo'), t('pkEntregar'), t('pkMaterial'), t('pkPN'), t('pkDesc'), t('pkCant'), t('pkNota'), t('pkPrepChk'), t('pkEntrChk')];
    var pf = [];
    dp.modelos.forEach(function(md){ md.mats.forEach(function(x){
      pf.push([md.orden, md.sm, entregaEstimada(md.inicio, dp.capDia, dp.capSab), x.k, x.pn || '—', x.desc, md.cant, x.parcial ? t('pkSolo') + ' ' + md.cant + ' ' + t('de') + ' ' + md.pend : '', '', '']);
    }); });
    var ws2 = XLSX.utils.aoa_to_sheet([[t('pkTitulo')], [t('impreso') + ': ' + ahora.toLocaleString(t('loc'))], [], ph].concat(pf).concat([[], [t('pkResumen')], [t('pkPN'), t('pkDesc'), t('pkCant'), t('pkModelos')]])
      .concat(dp.resumen.map(function(r){ return [r.pn, r.desc, r.cant, r.modelos.join(', ')]; })));
    var hs = { font:{ bold:true }, fill:{ fgColor:{rgb:'EEEEEE'} }, border: borde, alignment:{ horizontal:'center', wrapText:true } };
    ws2['A1'].s = { font:{ bold:true, sz:14 } };
    ph.forEach(function(_, c){ var ref = XLSX.utils.encode_cell({r:3, c:c}); ws2[ref].s = hs; });
    pf.forEach(function(fila, i){ fila.forEach(function(_, c){ var ref = XLSX.utils.encode_cell({r:4 + i, c:c}); if (!ws2[ref]) ws2[ref] = { t:'s', v:'' };
      ws2[ref].s = { border: borde, font:{ bold: c === 4 || c === 6 }, numFmt: c === 6 ? '#,##0' : undefined }; }); });
    var rr = 4 + pf.length + 1;
    var refT = XLSX.utils.encode_cell({r:rr, c:0}); if (ws2[refT]) ws2[refT].s = { font:{ bold:true, sz:12 } };
    [0,1,2,3].forEach(function(c){ var ref = XLSX.utils.encode_cell({r:rr + 1, c:c}); if (ws2[ref]) ws2[ref].s = hs; });
    ws2['!cols'] = [7, 20, 30, 9, 15, 30, 10, 26, 7, 7].map(function(w){ return { wch: w }; });
    XLSX.utils.book_append_sheet(wb, ws2, 'Pick List');
  }
  var f = ahora.getFullYear() + '-' + String(ahora.getMonth()+1).padStart(2,'0') + '-' + String(ahora.getDate()).padStart(2,'0') + '_' + String(ahora.getHours()).padStart(2,'0') + String(ahora.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb, 'Orden_Produccion_ASSY1_' + f + '.xlsx');
}

pintar();
ajustarPantalla();
