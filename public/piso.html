<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orden de producción · Piso P4</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.2/firebase-firestore-compat.min.js"></script>

<style>
:root{--bg:#0a0e1a;--card:#111827;--card2:#0d1220;--border:#1f2a3d;--text:#e8edf5;--text2:#8b96a8;--text3:#5c6678;--green:#00e676;--red:#ff4d4d;--yellow:#f1c40f;--accent:#4da6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;padding:16px}
.wrap{max-width:1400px;margin:0 auto}
/* Modo pantalla (TV/monitor): todo se escala para caber completo, sin scroll */
body.fit{overflow:hidden;padding:0;height:100vh}
body.fit .wrap{width:1400px;max-width:none;margin:0;position:absolute;top:0;left:0;transform-origin:0 0;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:26px;margin:0}
.langs{display:flex;gap:4px;align-items:center}
.langs button{background:#0d1220;border:1px solid var(--border);border-radius:6px;padding:4px 7px;cursor:pointer;transition:all .2s;opacity:.5}
.langs button:hover{opacity:.85;transform:scale(1.1)}
.langs button.on{opacity:1;border-color:var(--accent);background:var(--card);box-shadow:0 0 8px rgba(79,142,247,.3)}
.langs img{width:28px;height:20px;border-radius:3px;display:block}
.sub{color:var(--text2);font-size:15px;margin-bottom:14px}
.sub .old{color:var(--yellow);font-weight:700}
.corte{display:inline-block;padding:2px 10px;border-radius:8px}
.corte.ambar{background:rgba(241,196,15,.18);color:var(--yellow);font-weight:800;font-size:20px;animation:corteBlink 1.2s ease-in-out infinite}
.corte.rojo{background:rgba(255,77,77,.22);color:var(--red);font-weight:900;font-size:24px;animation:corteBlink .6s ease-in-out infinite}
@keyframes corteBlink{0%,100%{opacity:1}50%{opacity:.25}}
/* Modelo que está corriendo en ASSY1 (último pallet de ShipQR) */
.tbl tr.run-now td{animation:runBlink 1.2s ease-in-out infinite}
.tbl tr.run-now td:first-child{box-shadow:inset 6px 0 0 var(--accent)}
.runtag{display:inline-block;margin-top:4px;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--accent);color:#04203f;letter-spacing:.5px}
.enlinea{color:var(--accent);font-weight:800}
@keyframes runBlink{0%,100%{background:rgba(77,166,255,.30)}50%{background:rgba(77,166,255,.04)}}
@media print{.tbl tr.run-now td{animation:none!important}.runtag{border:1.5px solid #000;padding:0 4px}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.kpi .l{font-size:14px;color:var(--text2)}
.kpi .v{font-size:32px;font-weight:800;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;background:var(--card2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.tbl th{font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--text2);text-align:left;padding:12px 10px;border-bottom:2px solid var(--border)}
.tbl td{padding:14px 10px;border-top:1px solid var(--border);font-size:20px}
.r,.tbl th.r{text-align:right}
.sep td{background:#151d2e;color:var(--text2);font-size:15px;font-weight:700;padding:8px 12px}
.num{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;background:var(--green);color:#002b14;font-weight:900;font-size:22px}
.num.wait{background:#1f2a3d;color:var(--text2);font-size:18px}
.mdl{font-weight:800;color:var(--accent)}
.code{font-size:12px;color:var(--text3)}
.mdl + .code{font-size:15px;font-weight:700;color:#fcd34d;letter-spacing:.3px}
.chip{display:inline-block;font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;margin:2px}
.ok{background:rgba(0,230,118,.15);color:var(--green)}
.no{background:rgba(255,77,77,.18);color:var(--red)}
.na{background:#1f2a3d;color:var(--text3)}
.chip[data-tip]{cursor:help}
#chipTip{position:fixed;z-index:9999;display:none;pointer-events:none;background:#0b1220;color:#fff;border:1px solid #3a4a66;border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.5);max-width:360px}
#chipTip b{color:#4da6ff}#chipTip .f{color:#ff4d4d;font-weight:800}#chipTip .ok{color:#00e676;font-weight:800;background:none}
.bar{background:#1f2a3d;height:12px;border-radius:6px;min-width:90px}
.bar div{height:12px;border-radius:6px}
.est{font-weight:800;font-size:18px}
.done td{background:rgba(0,230,118,.07)}
.sep.sepdone td{background:rgba(0,230,118,.14);color:var(--green)}
.num.ok{background:rgba(0,230,118,.2);color:var(--green);border:2px solid var(--green)}
.prodok{color:var(--green);font-weight:900;font-size:22px}
.extra{display:block;font-size:13px;color:var(--green);font-weight:700}
.chain{display:flex;flex-direction:column;gap:10px;background:#0c1a2b;border:1px solid #1f5f7e;border-radius:14px;padding:12px;margin-bottom:14px}
.chain .crow{display:flex;align-items:stretch;gap:10px}
.chain .c{flex:1 1 0;background:var(--card);border:1px solid #2b6f8f;border-radius:10px;padding:10px 14px}
.chain .c .l{font-size:13px;font-weight:700;color:#7dd3fc}
.chain .c .v{font-size:30px;font-weight:800}
.chain .c .h{font-size:12px;color:var(--text2)}
.chain .c.f{border-color:#6b4e12}.chain .c.f .l,.chain .c.f .v{color:var(--yellow)}
.chain .c.z{background:#0f2a22;border-color:#1f7a5a}.chain .c.z .l,.chain .c.z .v{color:var(--green)}
.chain .op{display:flex;align-items:center;font-size:28px;color:var(--text2)}
.ships{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ships .s{flex:1 1 200px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px}
.ships .s.nx{border-color:#2b6f8f;background:#0c1a2b}
.ships .s .d{display:flex;justify-content:space-between;font-weight:800;font-size:16px}
.ships .s .d span:last-child{font-size:12px;color:#7dd3fc}
.ships .s .q{display:flex;justify-content:space-between;font-size:14px;color:var(--text2)}
.ships .s .q b{color:var(--text)}.ships .s .q b.z{color:var(--green)}.ships .s .q b.f{color:var(--yellow)}
.aviso{background:rgba(241,196,15,.12);border:1px solid var(--yellow);color:var(--yellow);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:14px;font-weight:700}
.pobar{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px;font-size:14px;font-weight:700;color:var(--text2)}
.pobar button{background:#0d1220;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer}
.pobar button:hover{border-color:var(--accent)}
.envtag{display:block;font-size:12px;font-weight:700;color:#c4b5fd}
.xtra{font-size:18px;font-weight:800;color:var(--green);margin-left:10px}
.potbl{margin-bottom:14px}.potbl .ptit{font-size:14px;font-weight:700;color:var(--text2);margin:0 0 6px}.potbl td,.potbl th{padding:6px 10px}.potbl tr.tot td{font-weight:800;border-top:2px solid var(--border);background:var(--card2)}.potbl .pf{color:var(--yellow);font-weight:800}.potbl tr.fam td{font-weight:800;background:#16233a;border-top:2px solid var(--border)}.potbl tr.fam td:first-child{color:#7dd3fc;font-size:15px}
.colpo{color:#7dd3fc;font-weight:800}
.colpf{font-weight:800;color:var(--green)}
@media (max-width:800px){.chain .crow{flex-wrap:wrap}.chain .c{flex:1 1 40%}.chain .op{display:none}}
.foot{color:var(--text3);font-size:13px;margin-top:10px}
.msg{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px;text-align:center;color:var(--text2);font-size:18px}
.login{max-width:360px;margin:40px auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.login input{width:100%;padding:10px;margin:6px 0;background:var(--card2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:15px}
.login button{width:100%;padding:10px;margin-top:8px;background:var(--accent);border:0;border-radius:8px;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:13px;margin-top:6px}
.acciones{display:flex;gap:6px;align-items:center;margin-right:8px}
.acciones button{background:#0d1220;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.acciones button:hover{border-color:var(--accent)}
.derecha{display:flex;align-items:center}
@page{size:letter landscape;margin:8mm}
#pick{display:none}
#pick{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;color:#000;background:#fff}
#pick .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:6px}
#pick h2{font-size:18px;margin:0}
#pick .pinfo{font-size:10px}
#pick .firmas{font-size:10px;line-height:2}
#pick .mh{display:flex;justify-content:space-between;align-items:center;border:1.5px solid #000;padding:4px 8px;margin-top:8px;font-size:12px;font-weight:800;page-break-after:avoid}
#pick .pn{display:inline-flex;width:20px;height:20px;border:1.5px solid #000;border-radius:50%;align-items:center;justify-content:center;margin-right:6px;font-size:11px}
#pick table{width:100%;border-collapse:collapse;margin:2px 0 4px;page-break-inside:avoid}
#pick th{font-size:9px;text-align:left;border-bottom:1.5px solid #000;padding:3px 4px;text-transform:uppercase}
#pick td{font-size:11px;border-bottom:0.5px solid #aaa;padding:4px}
#pick .r{text-align:right}
#pick .box{display:inline-block;width:13px;height:13px;border:1.5px solid #000;border-radius:2px}
#pick .nota{font-size:10px;font-weight:700;text-decoration:underline}
#pick .res{margin-top:10px;border-top:2px solid #000;padding-top:4px;page-break-inside:avoid}
#pick .res h3{font-size:12px;margin:2px 0 4px}
#pick .pfoot{font-size:9px;color:#444;margin-top:6px}
@media print{
  /* Ahorro de tinta: solo negro/gris, sin fondos de color ni barras rellenas */
  :root{--bg:#fff;--card:#fff;--card2:#fff;--border:#999;--text:#000;--text2:#222;--text3:#555;--green:#000;--red:#000;--yellow:#000;--accent:#000}
  *{-webkit-print-color-adjust:economy;print-color-adjust:economy;animation:none!important;box-shadow:none!important;background:transparent!important;color:#000!important}
  body,body.fit{padding:0;overflow:visible;height:auto;filter:grayscale(100%)}
  body.fit .wrap,.wrap{zoom:1!important;transform:none!important;position:static;width:auto;max-width:none;padding:0}
  .acciones,.langs,.bar{display:none!important}
  h1{font-size:18px}.sub{font-size:11px;margin-bottom:6px}
  .kpis{gap:6px;margin-bottom:8px}
  .pobar button{display:none!important}
  .chain{gap:6px;padding:6px;margin-bottom:8px;border:1px solid #999}.chain .c{padding:4px 8px;border:1px solid #999}.chain .c .v{font-size:16px}.chain .c .l,.chain .c .h{font-size:9px}.chain .op{font-size:14px}
  .ships{gap:6px;margin-bottom:8px}.ships .s{padding:4px 8px;border:1px solid #999}.ships .s .d{font-size:11px}.ships .s .q{font-size:10px}.kpi{padding:6px 10px;border:1px solid #999}.kpi .l{font-size:10px}.kpi .v{font-size:18px}
  .tblwrap{overflow:visible!important}.tbl{min-width:0!important}.tbl th,.tbl td{position:static!important;box-shadow:none!important}
  .tbl{border:1px solid #666}.tbl th{font-size:9px;padding:4px 5px;border-bottom:2px solid #000}
  .tbl td{font-size:11px;padding:3px 5px;border-top:1px solid #ccc}
  tr{page-break-inside:avoid}
  .sep td{font-size:10px;padding:4px 6px;border-top:2px solid #000;border-bottom:1px solid #000;text-transform:uppercase}
  .num{width:22px;height:22px;font-size:12px;border:1.5px solid #000}
  .mdl{font-size:12px}.code{font-size:8px;color:#444!important}.mdl + .code{font-size:10px;font-weight:700;color:#000!important}
  .chip{font-size:9px;padding:0 3px;margin:0 1px;border:1px solid #bbb;font-weight:400}
  .chip.no{border:1.5px solid #000;font-weight:800;text-decoration:underline}
  .chip.na{color:#888!important;border-style:dashed}
  .pm{display:inline!important}
  .est{font-size:11px}.prodok{font-size:13px}.extra{font-size:9px}
  .corte.ambar,.corte.rojo{font-size:11px}
  .foot{font-size:9px}
  body.modo-pick .wrap{display:none!important}
  body.modo-pick #pick{display:block!important}
}
/* Celular: la tabla conserva TODAS las columnas y se recorre de lado (scroll horizontal).
   Orden y Modelo se quedan fijos a la izquierda para no perder de vista qué modelo es. */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
@media (max-width:800px){.acciones,.derecha,.top{flex-wrap:wrap}.acciones button{font-size:12px}
  .tbl{min-width:980px;overflow:visible}.tbl td{font-size:15px;padding:10px 6px}.kpi .v{font-size:24px}h1{font-size:20px}
  .tbl th:first-child,.tbl tr:not(.sep) td:first-child{position:sticky;left:0;z-index:2;background:var(--card2);min-width:54px;width:54px}
  .tbl th:nth-child(2),.tbl tr:not(.sep) td:nth-child(2){position:sticky;left:54px;z-index:2;background:var(--card2);box-shadow:6px 0 8px -4px rgba(0,0,0,.6)}}
/* Vista previa del Pick List (antes de imprimir) */
#pickBar{display:none}
body.vista-pick,body.vista-pick.fit{overflow:auto!important;height:auto!important;padding:0!important}
body.vista-pick .wrap{display:none!important}
body.vista-pick #pickBar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:10;padding:10px 16px;background:#0d1220;border-bottom:1px solid #334}
body.vista-pick #pickBar .pbt{font-weight:800;color:#fff;font-size:15px}
body.vista-pick #pickBar button{font-size:14px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;border:1px solid #556;background:#1b2436;color:#fff}
body.vista-pick #pickBar button.imp{background:#00bcd4;border-color:#00bcd4;color:#001}
body.vista-pick #pick{display:block!important;max-width:1000px;margin:16px auto;padding:24px;border-radius:6px}
@media print{#pickBar{display:none!important}body.vista-pick #pick{margin:0;padding:0;max-width:none;border-radius:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="tTitle"></h1>
    <div class="derecha">
    <div class="acciones">
      <button id="btnZoomMenos" onclick="cambiarZoom(-0.1)">A−</button><button id="btnZoomPct" onclick="cambiarZoom(0)">100%</button><button id="btnZoomMas" onclick="cambiarZoom(0.1)">A+</button>
      <button id="btnPdf" onclick="imprimirPDF()">🖨️ PDF</button>
      <button id="btnXls" onclick="exportarExcel()">📊 Excel</button>
      <button id="btnPick" onclick="imprimirPickList()">📋 Pick List</button>
    </div>
    <div class="langs">
      <button data-l="es" title="Español"><img src="https://flagcdn.com/w40/mx.png" alt="MX"></button><button data-l="en" title="English"><img src="https://flagcdn.com/w40/us.png" alt="US"></button><button data-l="ko" title="한국어"><img src="https://flagcdn.com/w40/kr.png" alt="KR"></button>
    </div>
    </div>
  </div>
  <div class="sub" id="sub"></div>
  <div id="app"><div class="msg" id="loading"></div></div>
  <div class="foot" id="foot"></div>
</div>

<div id="pickBar"><span class="pbt" id="pbTitulo"></span><span><button class="imp" id="pbImprimir" onclick="window.print()"></button> <button id="pbCerrar" onclick="cerrarVistaPick()"></button></span></div>
<div id="pick"></div>

// ===== Cortes de envío (misma lógica que el BOM Simulator) =====
var cortesEspeciales = [];
function aplicarCorteEspecial(c){ var m = cortesEspeciales.find(function(x){ return x.original === c.getTime(); }); return m ? new Date(m.nuevo) : c; }
function generarCortesFinales(centro){
  var out = [];
  for (var i = -21; i <= 21; i++) {
    var dia = new Date(centro); dia.setDate(dia.getDate() + i); dia.setHours(0,0,0,0);
    var dow = dia.getDay(), c;
    if (dow === 3) { c = new Date(dia); c.setHours(15,30,0,0); out.push(aplicarCorteEspecial(c)); }
    else if (dow === 6) { c = new Date(dia); c.setHours(11,0,0,0); out.push(aplicarCorteEspecial(c)); }
  }
  return out.sort(function(a,b){ return a - b; });
}
function proximoCorte(desde){ var cs = generarCortesFinales(desde); for (var i = 0; i < cs.length; i++) if (cs[i] > desde) return cs[i]; return null; }

// Producido = pallets GH90 en ShipQR que aún NO están SHIPPED y no son REMPLAZO
// (misma regla que "Traer de ShipQR" en el BOM Simulator).
function leerProducido(){
  db.collection('shipqr_pallets').get().then(function(snap){
    var pm = {}, envs = [];
    snap.forEach(function(doc){
      var d = doc.data();
      if (d.motivo === 'REMPLAZO') return;
      var modelo = (d.modelo || '').trim();
      if (!modelo || !(d.part_number || '').toUpperCase().startsWith('GH90')) return;
      if (d.status === 'SHIPPED') {
        // Enviado: se guarda con su fecha para sumarlo al Producido si salió después de cargar el Excel del plan
        var tx = d.updated_at || d.created_at;
        envs.push({ sm: modelo, q: Number(d.quantity) || 0, ts: (tx && tx.seconds) ? tx.seconds * 1000 : 0 });
        return;
      }
      pm[modelo] = (pm[modelo] || 0) + (Number(d.quantity) || 0);
    });
    enviosVivo = envs;
    producidoVivo = pm;
    pintar();
  }).catch(function(e){ console.warn('No se pudo leer ShipQR, se usa el Producido publicado:', e); });
}

// Si no sale pallet nuevo en MIN_SIN_PALLET minutos, ya no se marca ninguno.
// (Ajustable: cambiar este número si se necesita más o menos tiempo.)
var MIN_SIN_PALLET = 120;
// Fecha a la que se asigna el resto del PO que el Excel aún no tiene en ningún envío (ajustable cada semana).
var FECHA_RESTO_PO = '2026-10-09';

window.togglePO = togglePO;
var enLinea = null; // { sm, ts }
function leerEnLinea(){
  db.collection('shipqr_pallets').orderBy('created_at', 'desc').limit(15).get().then(function(snap){
    var ult = null;
    snap.forEach(function(doc){
      if (ult) return;
      var d = doc.data();
      if (d.motivo === 'REMPLAZO') return;
      if (!(d.part_number || '').toUpperCase().startsWith('GH90')) return;
      var modelo = (d.modelo || '').trim();
      if (!modelo || !d.created_at || !d.created_at.seconds) return;
      ult = { sm: modelo, ts: new Date(d.created_at.seconds * 1000) };
    });
    enLinea = (ult && (Date.now() - ult.ts) <= MIN_SIN_PALLET * 6e4) ? ult : null;
    pintar();
  }).catch(function(e){ console.warn('No se pudo leer el último pallet:', e); });
}

function pintar(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.getElementById('tTitle').textContent = t('title');
  document.querySelectorAll('.langs button').forEach(function(b){ b.classList.toggle('on', b.dataset.l === lang); });
  document.getElementById('foot').textContent = t('foot');

  // Encabezado: corte + publicado
  var ahora = new Date(), sub = '';
  var pc = proximoCorte(ahora);
  if (pc) {
    var h12 = pc.getHours() % 12 || 12, ampm = pc.getHours() >= 12 ? 'pm' : 'am';
    var ms = pc - ahora, dd = Math.floor(ms / 864e5), hh = Math.floor(ms % 864e5 / 36e5), mm = Math.floor(ms % 36e5 / 6e4);
    var falta = (dd ? dd + ' ' + t('d') + ' ' : '') + hh + ' ' + t('h') + (dd ? '' : ' ' + mm + ' ' + t('m'));
    // Parpadea al acercarse el corte: menos de 4 h = amarillo, menos de 1 h = rojo y más rápido
    var cls = ms <= 36e5 ? ' rojo' : (ms <= 4 * 36e5 ? ' ambar' : '');
    sub += '<span class="corte' + cls + '">⏰ ' + t('corte') + ': ' + t('dias')[pc.getDay()] + ' ' + fechaCorta(pc) + ' ' + h12 + ':' + String(pc.getMinutes()).padStart(2,'0') + ampm + ' · ' + t('faltan') + ' <b>' + falta + '</b></span>';
  }
  if (plan && plan.publicadoEn) {
    var pub = new Date(plan.publicadoEn), edadMs = ahora - pub, viejo = edadMs > 12 * 36e5;
    var edadTxt = edadMs >= 36e5 ? Math.floor(edadMs / 36e5) + ' ' + t('h') + ' ' + Math.floor(edadMs % 36e5 / 6e4) + ' ' + t('m') : Math.floor(edadMs / 6e4) + ' ' + t('m');
    sub += ' · ' + t('publicado') + ': ' + pub.toLocaleString(t('loc'), {weekday:'short', hour:'numeric', minute:'2-digit'}) +
           (viejo ? ' <span class="old">⚠ ' + t('viejo') + '</span>' :
            (edadMs > 30 * 6e4 ? ' <span class="corte ambar" style="font-size:16px">⚠ ' + t('matViejo') + ' ' + edadTxt + '</span>' : ''));
  }
  if (enLinea) sub += ' · <span id="runSpan"></span>';
  document.getElementById('sub').innerHTML = sub;

  var app = document.getElementById('app');
  if (!plan) { app.innerHTML = '<div class="msg">' + t('loading') + '</div>'; return; }
  var mods = Array.isArray(plan.modelos) ? plan.modelos : [];
  if (!mods.length) { app.innerHTML = '<div class="msg">' + t('vacio') + '</div>'; return; }

  // Calcular con Producido en vivo
  // Enviado = pallets que ya salieron en trailer (SHIPPED) DESPUÉS de cargar el Excel del plan.
  // Se suman al Producido para que el avance no baje cuando sale el trailer. Cada Excel nuevo reinicia este conteo.
  var desde = (plan && plan.planCargadoEn) ? Date.parse(plan.planCargadoEn) : NaN;
  var envMap = {};
  if (producidoVivo && !isNaN(desde)) enviosVivo.forEach(function(e){ if (e.ts >= desde) envMap[e.sm] = (envMap[e.sm] || 0) + e.q; });
  var filas = mods.map(function(m0){
    var m = m0;
    var prod = (producidoVivo && producidoVivo[m.sm] !== undefined) ? producidoVivo[m.sm] : (m.producido || 0);
    if (producidoVivo && producidoVivo[m.sm] === undefined) prod = 0;
    var env = envMap[m0.sm] || 0;
    prod += env;
    // Si salió más de lo que pedía el envío (ej. 9,700 de 7,800), ese envío realmente fue de esa cantidad
    if (env > (m0.target || 0)) { m = Object.assign({}, m0); m.target = env; }
    var pend = Math.max(0, (m.target || 0) - prod);
    // PO Balance por producir (en vivo) = PO abierto publicado − producido sin embarcar.
    // PO final = lo que queda por producir del PO después de cubrir el envío (= PO por producir − pendiente del envío).
    var tienePO = m.poBalance !== null && m.poBalance !== undefined && !isNaN(Number(m.poBalance));
    var poLive = tienePO ? Math.max(0, Number(m.poBalance) - prod) : null;
    var poFin = tienePO ? Math.max(0, poLive - pend) : null;
    return { m: m, prod: prod, env: env, pend: pend, pct: m.target ? Math.min(100, Math.round(prod * 100 / m.target)) : 0, po: poLive, poFin: poFin };
  });
  var tot = filas.reduce(function(a, f){ a.t += f.m.target || 0; a.p += Math.min(f.prod, f.m.target || 0); return a; }, {t:0, p:0});

  var run = filas.filter(function(f){ return f.pend > 0 && f.m.orden; }).sort(function(a,b){ return a.m.orden - b.m.orden; });
  var wait = filas.filter(function(f){ return f.pend > 0 && !f.m.orden; }).sort(function(a,b){ return (a.m.prioridad||999) - (b.m.prioridad||999); });
  // Renumerar en vivo: 1, 2, 3… sin huecos (los completados ya no cuentan)
  run.forEach(function(f, i){ f.m = Object.assign({}, f.m, { orden: i + 1 }); });
  var done = filas.filter(function(f){ return f.pend === 0; });
  window._ultimo = { run: run, wait: wait, done: done, tot: tot };

  // Modelo que corre en ASSY1: el del último pallet. Si ese modelo ya se completó, deja de parpadear
  // y el parpadeo pasa al siguiente de la fila (primero en "Se pueden correr"), hasta que salga un pallet nuevo.
  var corriendoSM = null, esSiguiente = false;
  if (enLinea) {
    var fEn = filas.filter(function(f){ return f.m.sm === enLinea.sm; })[0];
    if (!fEn || fEn.pend > 0) corriendoSM = enLinea.sm;
    else if (run.length) { corriendoSM = run[0].m.sm; esSiguiente = true; }
    var rs = document.getElementById('runSpan');
    if (rs) {
      rs.innerHTML = esSiguiente
        ? '<span class="enlinea">▶ ' + t('sigLinea') + ': ' + esc(corriendoSM) + '</span> <span style="font-size:13px">(✓ ' + esc(enLinea.sm) + ' ' + t('completoTxt') + ')</span>'
        : '<span class="enlinea">▶ ' + t('enLinea') + ': ' + esc(enLinea.sm) + '</span> <span style="font-size:13px">(' + t('ultPallet') + ' ' + enLinea.ts.toLocaleTimeString(t('loc'), {hour:'numeric', minute:'2-digit'}) + ')</span>';
    }
  }
  var etiquetaRun = esSiguiente ? t('sigTag') : t('corriendo');

  var kp = function(l, v, color){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v"' + (color ? ' style="color:' + color + '"' : '') + '>' + v + '</div></div>'; };
  var avTot = tot.t ? Math.round(tot.p * 100 / tot.t) : 0;
  // KPIs principales: si el plan trae PO Balance, se muestran contra el PO (PO total − producido = PO por producir).
  // Sin PO Balance (plan viejo) se muestran los de siempre: Target / Producido / Pendiente / Avance.
  var kpPO = filas.filter(function(f){ return f.po !== null; });
  var kpiHtml;
  if (kpPO.length) {
    var poSum = 0, prodPO = 0;
    kpPO.forEach(function(f){ var p = Number(f.m.poBalance); poSum += p; prodPO += Math.min(f.prod, p); });
    var avPO = poSum ? Math.round(prodPO * 100 / poSum) : 0;
    kpiHtml = kp(t('kPO'), n(poSum)) + kp(t('prod'), n(prodPO)) + kp(t('cPO'), n(poSum - prodPO)) + kp(t('avance'), avPO + '%', avPO >= 100 ? 'var(--green)' : '');
  } else {
    kpiHtml = kp(t('target'), n(tot.t)) + kp(t('prod'), n(tot.p)) + kp(t('pend'), n(tot.t - tot.p)) + kp(t('avance'), avTot + '%', avTot >= 100 ? 'var(--green)' : '');
  }
  var html = '<div class="kpis">' + kpiHtml + '</div>';

  // Cadena PO: Próximo envío → PO Balance por producir − Falta para el envío = PO Balance final,
  // y lista de próximos envíos por fecha (cada uno descuenta del PO en orden).
  var conPO = filas.filter(function(f){ return f.po !== null; });
  if (!conPO.length) html += '<div class="aviso">⚠ ' + t('sinPO') + '</div>';
  if (conPO.length) {
    var poTot = 0, gs = {};
    conPO.forEach(function(f){
      poTot += f.po;
      var k = f.m.fecha || '';
      if (!gs[k]) gs[k] = { fecha: k, qty: 0, falta: 0, extra: 0, env: 0 };
      gs[k].qty += f.m.target || 0; gs[k].falta += f.pend; gs[k].extra += Math.max(0, f.prod - (f.m.target || 0)); gs[k].env += f.env || 0;
    });
    var lista = Object.keys(gs).sort(function(a, b){ return (a || '9999').localeCompare(b || '9999'); })
      .map(function(k){ return gs[k]; }).filter(function(g){ return g.falta > 0; });
    // Resto del PO sin envío en el Excel = PO abierto − cantidad de envío de cada modelo.
    // Se muestra como envío estimado en FECHA_RESTO_PO; lo ya producido de más en esos modelos se descuenta.
    var rq = 0, rp = 0, rDet = [];
    conPO.forEach(function(f){
      var po = Number(f.m.poBalance), tg = f.m.target || 0;
      var extra = Math.max(0, po - tg), ya = Math.min(extra, Math.max(0, f.prod - tg));
      rq += extra; rp += ya;
      if (extra - ya > 0) rDet.push(f.m.sm + ': ' + n(extra - ya));
    });
    if (rq - rp > 0) lista.push({ fecha: FECHA_RESTO_PO, qty: rq, falta: rq - rp, resto: true, det: rDet.join(' · ') });
    if (lista.length) {
      var rest = poTot;
      lista.forEach(function(g){ rest -= g.falta; g.after = Math.max(0, rest); g.prod = g.qty - g.falta; });
      var g0 = lista[0];
      html += '<div class="pobar"><span>' + t('poTitulo') + '</span><button onclick="togglePO()">' + (verPO ? '▲ ' + t('ocultar') : '▼ ' + t('mostrar')) + '</button></div>';
      var card = function(cls, l, v, h){ return '<div class="c' + cls + '"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="h">' + h + '</div></div>'; };
      if (verPO) html += '<div class="chain">' +
        // Ecuación 1 (envío): lo que se debe producir para el envío − lo que ya se produjo = lo que falta
        '<div class="crow">' + card('', t('cNext'), n(g0.qty), fechaEnvio(g0.fecha)) + '<div class="op">−</div>' +
          card('', t('cYa'), n(g0.prod) + (g0.extra > 0 ? '<span class="xtra" title="' + esc(t('cExtra')) + '">+' + n(g0.extra) + '</span>' : ''), t('cYah') + (g0.extra > 0 ? ' · ' + t('cExtra') : '') + (g0.env > 0 ? ' · ✈ ' + n(g0.env) + ' ' + t('cEnv') : '')) + '<div class="op">=</div>' +
          card(' f', t('cFalta'), n(g0.falta), t('cFaltah')) + '</div>' +
        // Ecuación 2 (PO): PO por producir − lo que falta del envío = PO final
        '<div class="crow">' + card('', t('cPO'), n(poTot), t('cPOh')) + '<div class="op">−</div>' +
          card(' f', t('cFalta'), n(g0.falta), t('cFalta2h')) + '<div class="op">=</div>' +
          card(' z', t('cFinal'), n(g0.after), t('cFinalh')) + '</div></div>';
      if (verPO) html += '<div class="ships">' + lista.slice(0, 5).map(function(g, i){
        return '<div class="s' + (i === 0 ? ' nx' : '') + '"' + (g.resto ? ' title="' + esc(g.det) + '"' : '') + '><div class="d"><span>' + fechaEnvio(g.fecha) + '</span><span>' + (g.resto ? t('estim') : (i === 0 ? t('nxt') : t('prog'))) + '</span></div>' +
          (g.resto ? '<div class="q"><span style="font-size:12px">' + t('restoTxt') + '</span></div>' : '') +
          '<div class="q"><span>' + t('shipQty') + '</span><b>' + n(g.qty) + '</b></div>' +
          '<div class="q"><span>' + t('shipProd') + '</span><b>' + n(g.prod) + (g.extra > 0 ? ' <span class="xtra" style="font-size:12px;margin-left:4px" title="' + esc(t('cExtra')) + '">+' + n(g.extra) + '</span>' : '') + '</b></div>' +
          '<div class="q"><span>' + t('shipFalta') + '</span><b class="f">' + n(g.falta) + '</b></div>' +
          '<div class="q"><span>' + t('poAfter') + '</span><b class="z">' + n(g.after) + '</b></div></div>';
      }).join('') + '</div>';
      // Tabla por modelo: cuánto falta del PO Balance total, con %
      if (verPO) {
        var pf = conPO.map(function(f){
          var p = Number(f.m.poBalance), pr = Math.min(f.prod, p), fl = Math.max(0, p - pr);
          var pcF = p ? Math.round(fl * 100 / p) : 0; if (fl > 0 && pcF === 0) pcF = 1; if (fl > 0 && pcF === 100 && pr > 0) pcF = 99;
          return { sm: f.m.sm, code: f.m.code || '', p: p, pr: pr, fl: fl, pcF: pcF };
        }).sort(function(a, b){ return b.fl - a.fl; });
        var sP = 0, sR = 0; pf.forEach(function(r){ sP += r.p; sR += r.pr; });
        // Agrupar por familia (ej. SM-F976UZKACHA y SM-F976UZKAXAA -> F976), la que más falta va primero
        var fams = {};
        pf.forEach(function(r){
          var mm = String(r.sm).replace(/^SM-/, '').match(/[A-Z]\d{3}/); r.fam = mm ? mm[0] : r.sm;
          var g = fams[r.fam] || (fams[r.fam] = { fam: r.fam, rows: [], p: 0, pr: 0, fl: 0 });
          g.rows.push(r); g.p += r.p; g.pr += r.pr; g.fl += r.fl;
        });
        var famList = Object.keys(fams).map(function(k){ return fams[k]; }).sort(function(a, b){ return b.fl - a.fl; });
        var sF = sP - sR, sPc = sP ? Math.round(sF * 100 / sP) : 0;
        var pfBar = function(pcF, fl){ return '<div class="bar"><div style="width:' + (100 - pcF) + '%;background:' + (fl > 0 ? '#7dd3fc' : 'var(--green)') + '"></div></div><div class="code">' + (100 - pcF) + '%</div>'; };
        html += '<div class="potbl"><div class="ptit">' + t('poTblT') + '</div><div class="tblwrap"><table class="tbl"><thead><tr><th>' + t('modelo') + '</th><th class="r">' + t('kPO') + '</th><th class="r">' + t('prod') + '</th><th class="r">' + t('poFaltaM') + '</th><th class="r">' + t('pctFalta') + '</th><th style="width:22%">' + t('avance') + '</th></tr></thead><tbody>' +
          famList.map(function(g){
            var gp = g.p ? Math.round(g.fl * 100 / g.p) : 0; if (g.fl > 0 && gp === 0) gp = 1; if (g.fl > 0 && gp === 100 && g.pr > 0) gp = 99;
            var gz = g.fl === 0 ? ' style="color:var(--green)"' : '';
            return '<tr class="fam"><td>' + esc(g.fam) + ' <span class="code">(' + g.rows.length + ')</span></td><td class="r">' + n(g.p) + '</td><td class="r">' + n(g.pr) + '</td><td class="r pf"' + gz + '>' + n(g.fl) + '</td><td class="r pf"' + gz + '>' + gp + '%</td><td>' + pfBar(gp, g.fl) + '</td></tr>' +
            g.rows.map(function(r){
              var z = r.fl === 0 ? ' style="color:var(--green)"' : '';
              return '<tr' + (r.fl === 0 ? ' class="done"' : '') + '><td style="padding-left:26px"><div class="mdl">' + esc(r.sm) + '</div><div class="code">' + esc(r.code) + '</div></td><td class="r">' + n(r.p) + '</td><td class="r">' + n(r.pr) + '</td>' +
                '<td class="r pf"' + z + '>' + n(r.fl) + '</td><td class="r pf"' + z + '>' + r.pcF + '%</td><td>' + pfBar(r.pcF, r.fl) + '</td></tr>';
            }).join('');
          }).join('') +
          '<tr class="tot"><td>' + t('totM') + '</td><td class="r">' + n(sP) + '</td><td class="r">' + n(sR) + '</td><td class="r pf">' + n(sF) + '</td><td class="r pf">' + sPc + '%</td><td>' + pfBar(sPc, sF) + '</td></tr>' +
          '</tbody></table></div></div>';
      }
    }
  }

  var chips = function(m){
    var mat = m.materiales;
    return ['Strip','Top','Bot','Bundle'].map(function(k){
      var v = mat ? mat[k] : null;
      var cls = v === true ? 'ok' : (v === false ? 'no' : 'na');
      var tip = (v === true || v === false) ? ' data-tip="' + esc(m.sm) + '|' + k + '"' : '';
      return '<span class="chip ' + cls + '"' + tip + '><span class="pm" style="display:none">' + (v === true ? '✓' : (v === false ? '✗' : '–')) + ' </span>' + k + '</span>';
    }).join('');
  };
  var envTag = function(f){ return f.env > 0 ? '<span class="envtag" title="' + esc(t('cEnvTip')) + '">✈ ' + n(f.env) + '</span>' : ''; };
  var poCells = function(f){ return '<td class="r" style="font-weight:700">' + (f.po === null ? '—' : n(Number(f.m.poBalance))) + '</td><td class="r colpo">' + (f.po === null ? '—' : n(f.po)) + '</td><td class="r colpf">' + (f.poFin === null ? '—' : n(f.poFin)) + '</td>'; };
  var bar = function(f, color){ return '<div class="bar"><div style="width:' + f.pct + '%;background:' + color + '"></div></div><div class="code">' + f.pct + '%</div>'; };
  var fila = function(f, tipo){

      est = '<span class="est" style="color:' + (cap >= f.pend ? 'var(--green)' : 'var(--yellow)') + '">⚡ ' + t('listo') + ' ' +
            (cap >= f.pend ? n(f.pend) : n(cap) + ' ' + t('de') + ' ' + n(f.pend)) + '</span>';
    } else {
      num = '<span class="num wait">⏳</span>';
      var faltan = ['Strip','Top','Bot','Bundle'].filter(function(k){ return m.materiales && m.materiales[k] === false; });
      est = '<span class="est" style="color:var(--red)">' + (faltan.length ? t('falta') + ' ' + faltan.join(', ') : t('sinDatos')) + '</span>';
    }
    var corre = corriendoSM === m.sm;
    return '<tr' + (corre ? ' class="run-now"' : '') + '><td>' + num + '</td><td><div class="mdl">' + esc(m.sm) + '</div><div class="code">' + esc(m.code || '') + '</div>' +
      (corre ? '<span class="runtag">▶ ' + etiquetaRun + '</span>' : '') + '</td>' +
      '<td style="white-space:nowrap">' + fechaEnvio(m.fecha) + '</td>' +
      '<td class="r hide-sm">' + n(m.target) + '</td><td class="r">' + n(f.prod) + envTag(f) + '</td><td class="r" style="font-weight:800">' + n(f.pend) + '</td>' +
      '<td class="hide-sm" style="width:14%">' + bar(f, tipo === 'run' ? 'var(--green)' : '#5c6678') + '</td>' +
      poCells(f) + '<td>' + chips(m) + '</td><td>' + est + '</td></tr>';
  };

  html += '<div class="tblwrap"><table class="tbl"><thead><tr><th style="width:60px">' + t('orden') + '</th><th>' + t('modelo') + '</th><th>' + t('envio') + '</th><th class="r hide-sm">' + t('target') + '</th><th class="r">' + t('prod') +
          '</th><th class="r">' + t('pend') + '</th><th class="hide-sm">' + t('avance') + '</th><th class="r">' + t('poTot') + '</th><th class="r" style="color:#7dd3fc">' + t('poBal') + '</th><th class="r" style="color:var(--green)">' + t('poFinal') + '</th><th>' + t('material') + '</th><th>' + t('estado') + '</th></tr></thead><tbody>';
  if (run.length) html += '<tr class="sep"><td colspan="12">⚡ ' + t('run') + '</td></tr>' + run.map(function(f){ return fila(f, 'run'); }).join('');
  if (wait.length) html += '<tr class="sep"><td colspan="12">⏳ ' + t('wait') + '</td></tr>' + wait.map(function(f){ return fila(f, 'wait'); }).join('');
  if (done.length) html += '<tr class="sep sepdone"><td colspan="12">✓ ' + t('done') + '</td></tr>' + done.map(function(f){
    var extra = f.prod - (f.m.target || 0);
    return '<tr class="done"><td><span class="num ok">✓</span></td><td><div class="mdl">' + esc(f.m.sm) + '</div><div class="code">' + esc(f.m.code || '') + '</div></td>' +
           '<td style="white-space:nowrap">' + fechaEnvio(f.m.fecha) + '</td><td class="r hide-sm">' + n(f.m.target) + '</td>' +
           '<td class="r"><span class="prodok">' + n(f.prod) + '</span>' + (extra > 0 ? '<span class="extra">+' + n(extra) + '</span>' : '') + envTag(f) + '</td>' +
           '<td class="r" style="color:var(--green);font-weight:800">0</td><td class="hide-sm">' + bar(f, 'var(--green)') + '</td>' + poCells(f) + '<td></td>' +
           '<td><span class="est" style="color:var(--green)">✓ ' + t('completo') + '</span></td></tr>';
  }).join('');
  html += '</tbody></table></div>';
  app.innerHTML = html;
  ajustarPantalla();
}
// Tamaño AJUSTABLE A MANO (A− / 100% / A+). Antes se encogía todo automáticamente para
// que cupiera en la pantalla y quedaba muy chico. Cada pantalla (TV, PC, celular) recuerda
// su propio tamaño en ese navegador.
var ZOOM_KEY = 'pisoZoom';
function zoomActual(){ try { var z = parseFloat(localStorage.getItem(ZOOM_KEY)); if (z >= 0.5 && z <= 3) return z; } catch (e) {} return 1; }
function ajustarPantalla(){
  var wrap = document.querySelector('.wrap'); if (!wrap) return;
  document.body.classList.remove('fit'); wrap.style.transform = '';
  var z = zoomActual();
  wrap.style.zoom = z;
  var pct = document.getElementById('btnZoomPct'); if (pct) { pct.textContent = Math.round(z * 100) + '%'; pct.title = t('zoomReset'); }
  var m = document.getElementById('btnZoomMenos'); if (m) m.title = t('zoomMenos');
  var M = document.getElementById('btnZoomMas'); if (M) M.title = t('zoomMas');
}
function cambiarZoom(d){
  var z = d === 0 ? 1 : Math.min(3, Math.max(0.5, Math.round((zoomActual() + d) * 10) / 10));
  try { localStorage.setItem(ZOOM_KEY, z); } catch (e) {}
  ajustarPantalla();
}
window.cambiarZoom = cambiarZoom;
window.addEventListener('resize', ajustarPantalla);
document.querySelectorAll('.langs img').forEach(function(img){ img.addEventListener('load', ajustarPantalla); });

// ===== ETIQUETA AL PASAR EL MOUSE (Strip/Top/Bot/Bundle) =====
// Un solo elemento flotante reutilizado; solo trabaja cuando el mouse está sobre un chip.
(function(){
  var tip = null;
  function datos(sm, k){
    var mods = (typeof plan !== 'undefined' && plan && Array.isArray(plan.modelos)) ? plan.modelos : [];
    var m = mods.find(function(x){ return x.sm === sm; }); if (!m) return null;
    var g = function(o){ return (o && o[k] !== null && o[k] !== undefined) ? Number(o[k]) : null; };
    return { pn: (m.pn && m.pn[k]) || '', desc: (m.desc && m.desc[k]) || '', ok: m.materiales && m.materiales[k] === true,
             inv: g(m.invTotal), disp: g(m.disp), req: g(m.req), falta: g(m.falta) };
  }
  function html(d, k){
    var h = '<div><b>' + esc(k) + ' · ' + esc(d.pn || '—') + '</b></div>' + (d.desc ? '<div style="color:#9aa7c0;font-size:12px">' + esc(d.desc) + '</div>' : '');
    if (d.req === null) return h + '<div style="color:#FFBA00;font-size:12px;margin-top:4px">' + t('tipRepub') + '</div>';
    if (d.inv !== null) h += '<div>' + t('tipInvTot') + ': <b style="color:#fff">' + n(d.inv) + '</b></div>';
    if (d.disp !== null && d.disp !== d.inv) h += '<div>' + t('tipDisp') + ': <b style="color:#fff">' + n(d.disp) + '</b> <span style="color:#9aa7c0;font-size:11px">' + t('tipPrio') + '</span></div>';
    h += '<div>' + t('tipReq') + ': <b style="color:#fff">' + n(d.req) + '</b></div>';
    h += d.falta > 0 ? '<div class="f">' + t('tipFalta') + ': ' + n(d.falta) + '</div>' : '<div class="ok">' + t('tipOk') + '</div>';
    return h;
  }
  document.addEventListener('mouseover', function(e){
    var c = e.target.closest ? e.target.closest('.chip[data-tip]') : null;
    if (!tip) { tip = document.createElement('div'); tip.id = 'chipTip'; document.body.appendChild(tip); }
    if (!c) { tip.style.display = 'none'; return; }
    var par = c.getAttribute('data-tip').split('|'), d = datos(par[0], par[1]);
    if (!d) { tip.style.display = 'none'; return; }
    tip.innerHTML = html(d, par[1]); tip.style.display = 'block';
    var r = c.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight;
    var x = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), window.innerWidth - w - 8);
    var y = r.top - hh - 8; if (y < 8) y = r.bottom + 8;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  window.addEventListener('scroll', function(){ if (tip) tip.style.display = 'none'; }, true);
})();

// ===== PICK LIST (almacén) =====
// Solo los modelos que se pueden correr (orden 1, 2, 3…), cantidad = lo que está Listo.
// Cada material (Strip/Top/Bot/Bundle) se pide 1 por pieza, igual que el Pick List del BOM Simulator.
function datosPickList(){
  var u = window._ultimo;
  if (!u) return null;
  var capDia = (plan && plan.capacidadDia) || 13000, capSab = (plan && plan.capacidadSabado) || 0;
  var acumulado = 0, faltanPN = false;
  var modelos = u.run.map(function(f){
    var m = f.m, cant = Math.min(m.cap || 0, f.pend);
    var inicio = acumulado; acumulado += cant;
    var mats = ['Strip','Top','Bot','Bundle'].map(function(k){
      var pn = m.pn ? m.pn[k] : '';
      var usa = m.materiales && m.materiales[k] !== null && m.materiales[k] !== undefined;
      if (usa && !pn) faltanPN = true;
      var num = function(o){ return (o && o[k] !== null && o[k] !== undefined) ? Number(o[k]) : null; };
      return { k: k, pn: pn || '', desc: (m.desc && m.desc[k]) || '', usa: usa, parcial: usa && m.materiales[k] === false, req: num(m.req), falta: num(m.falta) };
    }).filter(function(x){ return x.usa; });
    return { orden: m.orden, sm: m.sm, code: m.code || '', fecha: m.fecha, cant: cant, pend: f.pend, inicio: inicio, mats: mats };
  });
  var resumen = {};
  modelos.forEach(function(md){ md.mats.forEach(function(x){
    var key = x.pn || (x.k + ' · ' + md.sm);
    if (!resumen[key]) resumen[key] = { pn: x.pn || '—', desc: x.desc, cant: 0, req: 0, falta: 0, sinDato: false, modelos: [] };
    var r = resumen[key];
    r.cant += md.cant; r.modelos.push(md.sm);
    // Requerido del lote y lo que falta para completarlo (dato real publicado por el BOM Simulator).
    // Si el plan se publicó antes de este cambio no trae el dato: se muestra "—".
    if (x.req === null || x.falta === null) r.sinDato = true; else { r.req += x.req; r.falta += x.falta; }
  }); });
  return { modelos: modelos, resumen: Object.keys(resumen).sort().map(function(k){ return resumen[k]; }), capDia: capDia, capSab: capSab, faltanPN: faltanPN };
}

// Día estimado en que la línea llega a este modelo, según piezas antes de él y capacidad por día.
function entregaEstimada(inicio, capDia, capSab){
  if (inicio <= 0) return t('pkYa');
  var d = new Date(); d.setHours(0,0,0,0);
  var hoy = new Date(d), restante = inicio;
  for (var i = 0; i < 60; i++) {
    var cap = d.getDay() === 0 ? 0 : (d.getDay() === 6 ? capSab : capDia);
    if (restante < cap) break;
    restante -= cap; d.setDate(d.getDate() + 1);
  }
  var dias = Math.round((d - hoy) / 864e5);
  var cuando = dias === 0 ? t('pkHoy') : (dias === 1 ? t('pkManana') : t('dias')[d.getDay()] + ' ' + fechaCorta(d));
  return '≈ ' + cuando + ' · ' + t('pkDespues') + ' ' + n(inicio) + ' ' + t('pzas');
}

  var h = '<div class="ph"><div><h2>' + t('pkTitulo') + '</h2><div class="pinfo">' + t('corte') + ': ' + corteTxt + ' · ' + t('pkPlan') + ': ' + pub +

          '<div class="firmas">' + t('pkPreparo') + ': ________________<br>' + t('pkEntrego') + ': ________________<br>' + t('pkRecibio') + ': ________________</div></div>';

  if (!dp.modelos.length) h += '<p>' + t('pkNada') + '</p>';
  dp.modelos.forEach(function(md){
    h += '<div class="mh"><span><span class="pn">' + md.orden + '</span>' + esc(md.sm) + ' · ' + esc(md.code) + (md.fecha ? ' · ' + t('envio') + ' ' + fechaEnvio(md.fecha) : '') + '</span>' +
         '<span>' + t('pkPrep') + ': ' + n(md.cant) + ' ' + t('pzas') + ' · ' + t('pkEntregar') + ': ' + entregaEstimada(md.inicio, dp.capDia, dp.capSab) + '</span></div>';
    h += '<table><tr><th style="width:9%">' + t('pkMaterial') + '</th><th style="width:15%">' + t('pkPN') + '</th><th>' + t('pkDesc') + '</th><th class="r" style="width:9%">' + t('pkCant') +
         '</th><th style="width:22%">' + t('pkNota') + '</th><th style="width:5%">' + t('pkPrepChk') + '</th><th style="width:5%">' + t('pkEntrChk') + '</th></tr>';
    md.mats.forEach(function(x){
      h += '<tr><td>' + x.k + '</td><td><b>' + esc(x.pn || '—') + '</b></td><td>' + esc(x.desc) + '</td><td class="r"><b>' + n(md.cant) + '</b></td><td class="nota">' +
           (x.parcial ? t('pkSolo') + ' ' + n(md.cant) + ' ' + t('de') + ' ' + n(md.pend) : '') + '</td><td><span class="box"></span></td><td><span class="box"></span></td></tr>';
    });
    h += '</table>';
  });
  if (dp.resumen.length) {
    h += '<div class="res"><h3>' + t('pkResumen') + '</h3><table><tr><th style="width:16%">' + t('pkPN') + '</th><th>' + t('pkDesc') + '</th><th class="r" style="width:10%">' + t('pkCant') + '</th><th class="r" style="width:11%">' + t('pkReqLote') + '</th><th class="r" style="width:12%">' + t('pkFaltaLote') + '</th><th>' + t('pkModelos') + '</th></tr>';
    dp.resumen.forEach(function(r){ h += '<tr><td><b>' + esc(r.pn) + '</b></td><td>' + esc(r.desc) + '</td><td class="r"><b>' + n(r.cant) + '</b></td><td class="r">' + (r.sinDato ? '—' : n(r.req)) + '</td><td class="r">' +
      (r.sinDato ? '—' : (r.falta > 0 ? '<b style="font-size:13px;text-decoration:underline">' + n(r.falta) + '</b>' : '0')) + '</td><td>' + esc(r.modelos.join(', ')) + '</td></tr>'; });
    h += '</table></div>';
  }
  h += '<div class="pfoot">' + t('pkEstim') + ' (' + n(dp.capDia) + '/' + t('d') + ')</div>';
  document.getElementById('pick').innerHTML = h;
  // Ya no imprime directo: primero muestra la vista previa con botones Imprimir / Cerrar.
  document.getElementById('pbTitulo').textContent = t('pkVista');
  document.getElementById('pbImprimir').textContent = t('pkImprimir');
  document.getElementById('pbCerrar').textContent = t('pkCerrar');
  document.body.classList.add('modo-pick', 'vista-pick');
  window.scrollTo(0, 0);
}
function cerrarVistaPick(){ document.body.classList.remove('modo-pick', 'vista-pick'); }
window.addEventListener('afterprint', function(){ if (!document.body.classList.contains('vista-pick')) document.body.classList.remove('modo-pick'); });

// ===== EXCEL =====
function exportarExcel(){
  var u = window._ultimo;
  if (!u || typeof XLSX === 'undefined') { alert(t('sinDatosExp')); return; }
  var ahora = new Date();
  var head = [t('orden'), t('modelo'), t('codigo'), t('envio'), t('target'), t('prod'), t('pend'), t('avance') + ' %', 'Strip', 'Top', 'Bot', 'Bundle', t('estado'), t('seccion'), t('poTot'), t('poBal'), t('poFinal')];
  var mat = function(m, k){ var v = m.materiales ? m.materiales[k] : null; return v === true ? '✓' : (v === false ? '✗' : 'N/A'); };
  var estado = function(f, tipo){
    if (tipo === 'run') { var cap = f.m.cap || 0; return t('listo') + ' ' + (cap >= f.pend ? f.pend : cap + ' ' + t('de') + ' ' + f.pend); }
    if (tipo === 'wait') { var fl = ['Strip','Top','Bot','Bundle'].filter(function(k){ return f.m.materiales && f.m.materiales[k] === false; }); return fl.length ? t('falta') + ' ' + fl.join(', ') : t('sinDatos'); }
    return t('completo') + (f.prod > (f.m.target || 0) ? ' (+' + (f.prod - f.m.target) + ')' : '');
  };
  var filas = [], tipos = [];
  [['run', u.run], ['wait', u.wait], ['done', u.done]].forEach(function(g){
    g[1].forEach(function(f){
      filas.push([g[0] === 'run' ? f.m.orden : (g[0] === 'done' ? '✓' : '—'), f.m.sm, f.m.code || '', fechaEnvio(f.m.fecha),
        f.m.target || 0, f.prod, f.pend, f.pct, mat(f.m,'Strip'), mat(f.m,'Top'), mat(f.m,'Bot'), mat(f.m,'Bundle'), estado(f, g[0]), t(g[0]), f.po === null ? '' : Number(f.m.poBalance), f.po === null ? '' : f.po, f.poFin === null ? '' : f.poFin]);
      tipos.push(g[0]);
    });
  });
  var titulo = [[t('title')], [document.getElementById('sub').textContent], [t('impreso') + ': ' + ahora.toLocaleString(t('loc'))],
    [t('target') + ': ' + u.tot.t + '   ' + t('prod') + ': ' + u.tot.p + '   ' + t('pend') + ': ' + (u.tot.t - u.tot.p) + '   ' + t('avance') + ': ' + (u.tot.t ? Math.round(u.tot.p * 100 / u.tot.t) : 0) + '%'], []];
  var ws = XLSX.utils.aoa_to_sheet(titulo.concat([head]).concat(filas));
  var r0 = titulo.length;
  var borde = { top:{style:'thin',color:{rgb:'BBBBBB'}}, bottom:{style:'thin',color:{rgb:'BBBBBB'}}, left:{style:'thin',color:{rgb:'BBBBBB'}}, right:{style:'thin',color:{rgb:'BBBBBB'}} };
  var set = function(r, c, st){ var ref = XLSX.utils.encode_cell({r:r, c:c}); if (ws[ref]) ws[ref].s = st; };
  set(0, 0, { font:{ bold:true, sz:16 } });
  head.forEach(function(_, c){ set(r0, c, { font:{ bold:true, color:{rgb:'000000'} }, fill:{ fgColor:{rgb:'EEEEEE'} }, alignment:{ horizontal:'center', vertical:'center', wrapText:true }, border: borde }); });
  var fondo = { run:'FFFFFF', wait:'FFFFFF', done:'FFFFFF' };
  filas.forEach(function(fila, i){
    var r = r0 + 1 + i, tipo = tipos[i];
    fila.forEach(function(v, c){
      var st = { border: borde, fill:{ fgColor:{ rgb: fondo[tipo] } }, alignment:{ vertical:'center', horizontal: ((c >= 4 && c <= 7) || c >= 14) ? 'right' : (c === 0 || (c >= 8 && c <= 11) ? 'center' : 'left') } };
      if ((c >= 4 && c <= 6) || c >= 14) st.numFmt = '#,##0';
      if (c === 1) st.font = { bold:true, color:{rgb:'0B4FA3'} };
      if (c === 6) st.font = { bold:true };
      if (c >= 8 && c <= 11) { st.font = { bold:true, color:{ rgb: v === '✓' ? '0A7A3A' : (v === '✗' ? 'C00000' : '777777') } }; }
      if (c === 12) st.font = { bold:true, color:{ rgb: tipo === 'wait' ? 'C00000' : (tipo === 'done' ? '0A7A3A' : '0A7A3A') } };
      if (c === 0) st.font = { bold:true, sz:12 };
      set(r, c, st);
    });
  });
  ws['!cols'] = [6, 22, 15, 10, 10, 11, 11, 10, 7, 7, 7, 8, 26, 18, 11, 11, 11].map(function(w){ return { wch: w }; });
  ws['!merges'] = [0,1,2,3].map(function(r){ return { s:{r:r,c:0}, e:{r:r,c:16} }; });
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:r0,c:0}, e:{r:r0 + filas.length, c:16} }) };
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, t('hojaPlan'));
  var dp = datosPickList();
  if (dp && dp.modelos.length) {
    var ph = [t('orden'), t('modelo'), t('pkEntregar'), t('pkMaterial'), t('pkPN'), t('pkDesc'), t('pkCant'), t('pkNota'), t('pkPrepChk'), t('pkEntrChk')];
    var pf = [];
    dp.modelos.forEach(function(md){ md.mats.forEach(function(x){
      pf.push([md.orden, md.sm, entregaEstimada(md.inicio, dp.capDia, dp.capSab), x.k, x.pn || '—', x.desc, md.cant, x.parcial ? t('pkSolo') + ' ' + md.cant + ' ' + t('de') + ' ' + md.pend : '', '', '']);
    }); });
    var ws2 = XLSX.utils.aoa_to_sheet([[t('pkTitulo')], [t('impreso') + ': ' + ahora.toLocaleString(t('loc'))], [], ph].concat(pf).concat([[], [t('pkResumen')], [t('pkPN'), t('pkDesc'), t('pkCant'), t('pkReqLote'), t('pkFaltaLote'), t('pkModelos')]])
      .concat(dp.resumen.map(function(r){ return [r.pn, r.desc, r.cant, r.sinDato ? '—' : r.req, r.sinDato ? '—' : r.falta, r.modelos.join(', ')]; })));
    var hs = { font:{ bold:true }, fill:{ fgColor:{rgb:'EEEEEE'} }, border: borde, alignment:{ horizontal:'center', wrapText:true } };
    ws2['A1'].s = { font:{ bold:true, sz:14 } };
    ph.forEach(function(_, c){ var ref = XLSX.utils.encode_cell({r:3, c:c}); ws2[ref].s = hs; });
    pf.forEach(function(fila, i){ fila.forEach(function(_, c){ var ref = XLSX.utils.encode_cell({r:4 + i, c:c}); if (!ws2[ref]) ws2[ref] = { t:'s', v:'' };
      ws2[ref].s = { border: borde, font:{ bold: c === 4 || c === 6 }, numFmt: c === 6 ? '#,##0' : undefined }; }); });
    var rr = 4 + pf.length + 1;
    var refT = XLSX.utils.encode_cell({r:rr, c:0}); if (ws2[refT]) ws2[refT].s = { font:{ bold:true, sz:12 } };
    [0,1,2,3,4,5].forEach(function(c){ var ref = XLSX.utils.encode_cell({r:rr + 1, c:c}); if (ws2[ref]) ws2[ref].s = hs; });
    ws2['!cols'] = [7, 20, 30, 9, 15, 30, 10, 26, 7, 7].map(function(w){ return { wch: w }; });
    XLSX.utils.book_append_sheet(wb, ws2, 'Pick List');
  }
  var f = ahora.getFullYear() + '-' + String(ahora.getMonth()+1).padStart(2,'0') + '-' + String(ahora.getDate()).padStart(2,'0') + '_' + String(ahora.getHours()).padStart(2,'0') + String(ahora.getMinutes()).padStart(2,'0');
  XLSX.writeFile(wb, 'Orden_Produccion_ASSY1_' + f + '.xlsx');
}

pintar();
ajustarPantalla();
</script>
