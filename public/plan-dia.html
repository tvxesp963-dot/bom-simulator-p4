<style>
:root{--bg:#0a0e1a;--card:#111827;--bd:#1f2a3d;--tx:#e8edf5;--t2:#8b96a8;--ac:#4da6ff;--gr:#00e676;--rd:#ff4d4d;--yl:#f1c40f}
:root[data-theme="light"]{--bg:#f3f5f9;--card:#fff;--bd:#d8dee9;--tx:#1a2233;--t2:#5b6678;--ac:#1a73e8;--gr:#0a8f4d;--rd:#c62828;--yl:#9a6b00}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f9;--card:#fff;--bd:#d8dee9;--tx:#1a2233;--t2:#5b6678;--ac:#1a73e8;--gr:#0a8f4d;--rd:#c62828;--yl:#9a6b00}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:14px 16px 40px}
.wrap{max-width:1240px;margin:0 auto}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar h1{font-size:18px;margin:0;flex:1;min-width:220px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:14px;cursor:pointer}
.btn.w{background:#128c7e}.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn:disabled{opacity:.55;cursor:default}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-right:8px}
.msg{font-size:13px;color:var(--t2);margin:6px 0}
.msg.ok{color:var(--gr)}.msg.er{color:var(--rd)}
.login{max-width:340px;margin:60px auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;display:grid;gap:10px}
.login input{background:transparent;border:1px solid var(--bd);border-radius:8px;padding:10px;color:var(--tx);font-size:14px}
.login .err{color:var(--rd);font-size:13px}
.sheet{background:#fff;color:#111;border-radius:10px;padding:16px;border:1px solid var(--bd);overflow:auto}
.sheet h2{margin:0;font-size:20px;color:#1a3a6b}
.sheet .sub{font-size:12px;color:#555;margin:2px 0 12px}
.sec{color:#fff;font-weight:800;padding:6px 10px;border-radius:5px;font-size:13px;margin:12px 0 4px}
.sec.a{background:#0f6b3c}.sec.m{background:#1a4f9c}.sec.b{background:#7a4a00}
table.p{border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:6px}
table.p th{background:#1a3a6b;color:#fff;padding:5px 6px;text-align:center;font-weight:700;line-height:1.2;white-space:nowrap}
table.p th small{display:block;font-weight:400;font-size:10px;opacity:.85}
table.p td{border:1px solid #cfd6e4;padding:4px 6px;text-align:right}
table.p td.m{text-align:left;font-weight:600}
table.p td.m small{display:block;font-weight:400;color:#555;font-size:10.5px}
table.p td.q{background:#eaf3ff;font-weight:700}
table.p td.z{color:#b0b6c4;text-align:center}
table.p td.s{text-align:left;font-size:11.5px}
table.p td.s.ok{color:#0a7a3e;font-weight:700}table.p td.s.no{color:#b3261e;font-weight:700}table.p td.s.mid{color:#946200;font-weight:700}
table.p tr.tot td{background:#f2f4f9;font-weight:800}
.g{background:#fff6e0!important;color:#946200;font-style:italic}
.cv{display:block;font-weight:700;font-size:10.5px}.cv.p{color:#946200}.cv.n{color:#b3261e}
/* Versión "foto" (WhatsApp): más ancha, letra grande y bordes marcados para que se lea en el celular */
.sheet.foto{width:1500px;max-width:none;padding:26px;overflow:visible}
.sheet.foto h2{font-size:30px}.sheet.foto .sub{font-size:16px;margin-bottom:16px}
.sheet.foto .sec{font-size:20px;padding:9px 14px;margin:18px 0 6px}
.sheet.foto table.p{font-size:17px}
.sheet.foto table.p th{font-size:16px;padding:9px 8px}.sheet.foto table.p th small{font-size:12px}
.sheet.foto table.p td{padding:9px 10px;border:1.5px solid #9aa6bf}
.sheet.foto table.p td.m small{font-size:13px}.sheet.foto table.p td.s{font-size:15px}
.sheet.foto table.p td.q{font-size:18px;background:#d6e8ff}.sheet.foto table.p td.g{background:#ffedc2!important}
.sheet.foto .cv{font-size:13px}.sheet.foto .nomat{font-size:16px}.sheet.foto .foot{font-size:13px}
.nomat{color:#b3261e;font-weight:800;font-size:12px;margin:8px 0 3px}
.vacio{padding:10px;color:#666;font-size:13px}
.foot{font-size:11px;color:#666;margin-top:8px}
@page{size:letter landscape;margin:9mm}
@media print{
  body{background:#fff;padding:0}
  .bar,.msg,.noprint{display:none!important}
  .sheet{border:0;padding:0;overflow:visible}
  table.p{font-size:10.5px}
  table.p tr{page-break-inside:avoid}
  .sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.p th,table.p td.q,table.p tr.tot td,.sec{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

  genImg: '⏳ Generando imagen… · Building image… · 이미지 생성 중…', waCopiada: '✅ Imagen copiada. En WhatsApp pégala con Ctrl+V · Image copied: paste in WhatsApp · 이미지 복사됨: WhatsApp에 붙여넣기', waDescargada: '✅ Imagen descargada. Adjúntala en el chat de WhatsApp · Image downloaded: attach it in WhatsApp · 이미지 다운로드됨: WhatsApp에 첨부', errImg: '⚠ No se pudo generar la imagen · Could not build the image · 이미지 생성 실패',
  sinMat: '⚠ Sin material — fuera del plan por día · No material — not in daily plan · 자재 없음 — 일별 계획 제외',
  pend: ['Pendiente','Pending','잔량'],
  nota: 'Celda crema/cursiva = guía (falta material) · ✓ = lo que ya hay disponible. Producido ya descontado. Cada día se llena a la capacidad de la línea (ASSY 13,000): primero lo que ya tiene material y después el resto como guía. · Produced already deducted. Each day fills to line capacity (ASSY 13,000): available material first, the rest as a guide. · 생산량 차감 완료. 매일 라인 능력(ASSY 13,000)까지 채움: 자재 있는 모델 먼저, 나머지는 참고용.'
};
function tr3(a){ return a[0] + ' · ' + a[1] + ' · ' + a[2]; }
function th3(a){ return a[0] + '<small>' + a[1] + ' · ' + a[2] + '</small>'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function num(x){ return Math.round(x || 0).toLocaleString('en-US'); }
function fechaD(iso){ return new Date(iso + 'T12:00:00'); }
function fechaEnvio(iso){ if (!iso) return '—'; var d = fechaD(iso); if (isNaN(d)) return '—'; return d.getDate() + '-' + MESES[d.getMonth()][1]; }
function isoSemana(d){ var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())), dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn); var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 86400000 + 1) / 7); }
function fechaHora(iso){ if (!iso) return '—'; var d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('en-GB') + ' ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }

// ===== Firebase =====
firebase.initializeApp({apiKey:"AIzaSyDbaC1kFX4ERhndtXDyHg8eCcexP5IjAuI",authDomain:"mes-production-esp.firebaseapp.com",projectId:"mes-production-esp"});
var db = firebase.firestore(); try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e) {}
var DATOS = null, AREAS = { assy: true, medio: true, bundle: true }, cargando = false;
var root = document.getElementById('root');

function mostrarLogin(){
  root.innerHTML = '<div class="login"><div style="font-weight:700">' + esc(T.login) + '</div><input id="lgE" type="email" placeholder="' + esc(T.correo) + '"><input id="lgP" type="password" placeholder="' + esc(T.pass) + '"><button class="btn" id="lgB">' + esc(T.entrar) + '</button><div class="err" id="lgErr"></div></div>';
  document.getElementById('lgB').onclick = function(){
    firebase.auth().signInWithEmailAndPassword(document.getElementById('lgE').value.trim(), document.getElementById('lgP').value).catch(function(){ document.getElementById('lgErr').textContent = T.errLogin; });
  };
}
var FIJO = null;   // datos del plan fijado (quién y cuándo) o null si se ve en vivo
function leerVivo(){
  var col = db.collection('bom_simulator_p4');
  return Promise.all([col.doc('plan_piso').get(), col.doc('plan_piso_medio').get(), col.doc('plan_piso_bundle').get()]).then(function(r){
    return { assy: r[0].exists ? r[0].data() : null, medio: r[1].exists ? r[1].data() : null, bundle: r[2].exists ? r[2].data() : null };
  });
}
function errLectura(e){ cargando = false; if (e && e.code === 'permission-denied') mostrarLogin(); else root.innerHTML = '<div class="login"><div class="err">' + esc(e && e.message || e) + '</div></div>'; throw e; }
// Lectura normal: el plan FIJADO (1 sola lectura). Si nunca se ha fijado, se ve en vivo.
function leerDatos(){
  if (cargando) return Promise.resolve(); cargando = true;
  return db.collection('bom_simulator_p4').doc('plan_dia_fijo').get().then(function(f){
    if (f.exists && f.data().json) {
      try { DATOS = JSON.parse(f.data().json); FIJO = { en: f.data().fijadoEn, por: f.data().fijadoPor }; cargando = false; return; } catch (e) {}
    }
    return leerVivo().then(function(d){ DATOS = d; FIJO = null; cargando = false; });
  }).catch(errLectura);
}
// Ver el plan en vivo (no se guarda)
function verVivo(){
  if (cargando) return; cargando = true; DATOS = null; pintar();
  leerVivo().then(function(d){ DATOS = d; FIJO = null; cargando = false; pintar(); }).catch(errLectura);
}
// Fijar el plan: guarda una foto de lo publicado; todos los envíos usan esa misma foto hasta que se vuelva a fijar
function fijarPlan(){
  if (cargando) return; cargando = true; msg(T.fijando);
  leerVivo().then(function(d){
    var u = (firebase.auth().currentUser && firebase.auth().currentUser.email) || '';
    var json = JSON.stringify(d), en = new Date().toISOString();
    return db.collection('bom_simulator_p4').doc('plan_dia_fijo').set({ json: json, fijadoEn: en, fijadoPor: u }).then(function(){
      DATOS = d; FIJO = { en: en, por: u }; cargando = false; pintar(); msg(T.fijado, 'ok');
    });
  }).catch(function(e){ cargando = false; msg(T.errFijar + ' ' + (e && e.message || ''), 'er'); });
}

// ===== Armado de filas por área =====
function sumaDia(porDia){ return (porDia || []).reduce(function(s, x){ return s + (x.q || 0); }, 0); }
function faltantesObj(mat, pend){ var o = []; Object.keys(mat || {}).forEach(function(k){ if (mat[k] === false) o.push(k); }); return o; }
function filasAssy(doc){
  if (!doc || !doc.modelos) return [];
  return repartoAssy(doc.modelos.filter(function(m){ return (m.pendiente || 0) > 0 || (m.porDia && m.porDia.length); }).map(function(m){
    var pend = m.pendiente || 0, cap = m.cap || 0, est, cls;
    if (cap >= pend && pend > 0) { est = T.listo; cls = 'ok'; }
    else if (cap > 0) { est = T.parcial + ' ' + num(cap) + ' / ' + num(pend); cls = 'mid'; }
    else { var f = faltantesObj(m.materiales); est = T.falta + (f.length ? ': ' + f.join(', ') : ''); cls = 'no'; }
    return { et: m.sm, sub: m.code || '', pieza: m.code || '', fecha: m.fecha || '', porDia: m.porDia || [], total: sumaDia(m.porDia) || pend, est: est, cls: cls, orden: (m.porDia && m.porDia[0]) ? m.porDia[0].f : '9999', prio: m.prioridad || 999, ord: m.orden || 999, cap: (m.cap == null ? null : m.cap), capTot: m.cap || 0, pend: pend };
  }), doc);
}
// ASSY: reparto propio con la capacidad diaria (13,000): solo modelos con material,
// en el orden del piso (más material listo primero, hacia abajo), llenando cada día.
function isoLocal(d){ return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function repartoAssy(rows, doc){
  var capL = Number(doc && doc.capacidadDia) || 13000, capS = Number(doc && doc.capacidadSabado) || 0;
  var sab = !!(doc && doc.cal && doc.cal.sab) && capS > 0;
  var listos = rows.filter(function(r){ return r.cls !== 'no' && r.capTot > 0 && r.pend > 0; })
    .sort(function(a, b){ return (a.ord - b.ord) || (b.capTot - a.capTot) || (a.prio - b.prio); });
  var d = new Date(); d.setHours(12, 0, 0, 0);
  function valido(x){ var w = x.getDay(); return w >= 1 && w <= 5 || (w === 6 && sab); }
  while (!valido(d)) d.setDate(d.getDate() + 1);
  var resto = (d.getDay() === 6) ? capS : capL;
  function poner(r, q, guia){
    var guard = 0;
    while (q > 0 && guard++ < 80) {
      if (resto <= 0) { do { d.setDate(d.getDate() + 1); } while (!valido(d)); resto = (d.getDay() === 6) ? capS : capL; }
      var t = Math.min(q, resto), f = isoLocal(d), ex = r.porDia.filter(function(x){ return x.f === f && !!x.g === guia; })[0];
      if (ex) ex.q += t; else r.porDia.push({ f: f, q: t, g: guia });
      q -= t; resto -= t;
    }
  }
  rows.forEach(function(r){ r.porDia = []; });
  // Pasada 1: lo que YA tiene material (más material primero)
  listos.forEach(function(r){ poner(r, Math.min(r.capTot, r.pend), false); });
  // Pasada 2: lo que falta producir de cada modelo, como guía (orden de envío y prioridad)
  rows.filter(function(r){ return r.pend - Math.min(r.capTot, r.pend) > 0; })
    .sort(function(a, b){ return ((a.fecha || '9999') < (b.fecha || '9999') ? -1 : (a.fecha || '9999') > (b.fecha || '9999') ? 1 : 0) || (a.prio - b.prio); })
    .forEach(function(r){ poner(r, r.pend - Math.min(r.capTot, r.pend), true); });
  rows.forEach(function(r){
    r.porDia.sort(function(x, y){ return x.f < y.f ? -1 : x.f > y.f ? 1 : (x.g ? 1 : 0) - (y.g ? 1 : 0); });
    r.total = sumaDia(r.porDia); r.orden = r.porDia.length ? r.porDia[0].f : '9999'; r.cap = null;
  });
  return rows;
}
function filasColas(doc, orden, etiqueta){
  if (!doc || !doc.colas) return [];
  var out = [], keys = Object.keys(doc.colas).sort(function(a, b){ var ia = orden.indexOf(a), ib = orden.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  keys.forEach(function(k){
    (doc.colas[k] || []).forEach(function(it){
      if (!((it.pendiente || 0) > 0 || (it.porDia && it.porDia.length))) return;
      var mats = it.materiales || [], falt = mats.filter(function(x){ return x.e ? x.e !== 'ok' : x.disp < x.req; }).map(function(x){ return x.k; });
      var est, cls; var pend = it.pendiente || 0;
      if (it.listo && !falt.length) { est = T.listo; cls = 'ok'; }
      else if (it.listo) { est = T.parcial + (falt.length ? ': ' + falt.join(', ') : ''); cls = 'mid'; }
      else { est = T.falta + (falt.length ? ': ' + falt.join(', ') : ''); cls = 'no'; }
      var ms = it.modelos || [it.sm];
      out.push({ et: etiqueta(k) + ' · ' + (ms[0] || ''), sub: ms.length > 1 ? '+' + (ms.length - 1) + ' ' + ms.slice(1).join(', ') : '', pieza: it.pn || '', fecha: it.fecha || '', porDia: it.porDia || [], total: sumaDia(it.porDia) || pend, est: est, cls: cls, grupo: k, capDia: Number(it.capDia) || 0, pend: pend, prio: it.prioridad || 999 });
    });
  });
  return guiaColas(out, doc);
}
// Medio proceso y Bundle: misma regla que ASSY. Lo que ya tiene material sigue como lo programó el simulador;
// lo que falta de cada modelo se agrega como guía (g:true) en los huecos de capacidad de cada línea.
function guiaColas(rows, doc){
  var cal = (doc && doc.cal) || {}, fS = cal.sab ? (Number(cal.fSab) || 0) : 0;
  var grupos = {}; rows.forEach(function(r){ (grupos[r.grupo] = grupos[r.grupo] || []).push(r); });
  Object.keys(grupos).forEach(function(k){
    var G = grupos[k], cap = Math.max.apply(null, G.map(function(r){ return r.capDia; }).concat([0]));
    if (!(cap > 0)) return;
    var usado = {};
    G.forEach(function(r){ r.porDia.forEach(function(x){ usado[x.f] = (usado[x.f] || 0) + (x.q || 0); }); });
    var d = new Date(); d.setHours(12, 0, 0, 0);
    function fct(x){ var w = x.getDay(); return (w >= 1 && w <= 5) ? 1 : (w === 6 ? fS : 0); }
    G.filter(function(r){ return r.pend - sumaDia(r.porDia) > 0; })
      .sort(function(a, b){ return ((a.fecha || '9999') < (b.fecha || '9999') ? -1 : (a.fecha || '9999') > (b.fecha || '9999') ? 1 : 0) || (a.prio - b.prio); })
      .forEach(function(r){
        var q = r.pend - sumaDia(r.porDia), dd = new Date(d), guard = 0;
        while (q > 0 && guard++ < 120) {
          var f = fct(dd);
          if (f > 0) {
            var iso = isoLocal(dd), room = Math.round(cap * f) - (usado[iso] || 0);
            if (room > 0) { var t = Math.min(q, room); r.porDia.push({ f: iso, q: t, g: true }); usado[iso] = (usado[iso] || 0) + t; q -= t; }
          }
          dd.setDate(dd.getDate() + 1);
        }
      });
    G.forEach(function(r){
      r.porDia.sort(function(x, y){ return x.f < y.f ? -1 : x.f > y.f ? 1 : (x.g ? 1 : 0) - (y.g ? 1 : 0); });
      r.total = sumaDia(r.porDia) || r.pend; r.guiado = true;
    });
  });
  return rows;
}
function armar(){
  var A = { assy: filasAssy(DATOS.assy), medio: filasColas(DATOS.medio, ['Zhongke','S1','S2','S3','S4','S5','VC1','VC2'], function(k){ return k; }), bundle: filasColas(DATOS.bundle, ['B1','B2','PRE'], function(k){ return k === 'PRE' ? 'Pre kit' : k; }) };
  var N = {};
  Object.keys(A).forEach(function(k){ if (k === 'assy') { N[k] = []; return; } N[k] = A[k].filter(function(r){ return r.cls === 'no' && !r.guiado; }); A[k] = A[k].filter(function(r){ return !(r.cls === 'no' && !r.guiado); }); });
  A.assy.sort(function(a, b){ return a.orden < b.orden ? -1 : a.orden > b.orden ? 1 : (a.ord - b.ord) || (a.prio - b.prio); });
  // Columnas = días con producción en las áreas elegidas (máx. 7); lo demás va en "Después"
  var set = {};
  Object.keys(A).forEach(function(k){ if (!AREAS[k]) return; A[k].forEach(function(r){ r.porDia.forEach(function(x){ if (x.q > 0) set[x.f] = 1; }); }); });
  var dias = Object.keys(set).sort(), cols = dias.slice(0, 7), hayDesp = dias.length > cols.length;
  return { A: A, N: N, cols: cols, hayDesp: hayDesp };
}
function tablaHtml(rows, cols, hayDesp, tipo){
  if (!rows.length) return '<div class="vacio">' + esc(T.sinPlan) + '</div>';
  var h = '<table class="p"><thead><tr><th style="text-align:left">' + th3(tipo === 'assy' ? T.modelo : T.linea) + '</th>' + (tipo === 'assy' ? '' : '<th>' + th3(T.pieza) + '</th>') + '<th>' + th3(T.envio) + '</th>';
  cols.forEach(function(c){ var d = fechaD(c), w = DIAS[d.getDay()]; h += '<th>' + w[0] + ' ' + d.getDate() + '<small>' + w[1] + ' · ' + w[2] + '</small></th>'; });
  if (hayDesp) h += '<th>' + th3(T.desp) + '</th>';
  h += '<th>' + th3(T.total) + '</th><th style="text-align:left">' + th3(T.estado) + '</th></tr></thead><tbody>';
  var tot = { cols: cols.map(function(){ return 0; }), desp: 0, total: 0 };
  rows.forEach(function(r){
    h += '<tr><td class="m">' + esc(r.et) + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</td>' + (tipo === 'assy' ? '' : '<td style="text-align:left">' + esc(r.pieza) + '</td>') + '<td style="text-align:center">' + esc(fechaEnvio(r.fecha)) + '</td>';
    cols.forEach(function(c, i){ var q = r.porDia.filter(function(x){ return x.f === c; }).reduce(function(s, x){ return s + (x.q || 0); }, 0); tot.cols[i] += q;
      var qa = r.porDia.filter(function(x){ return x.f === c && !x.g; }).reduce(function(s, x){ return s + (x.q || 0); }, 0);
      h += q > 0 ? '<td class="q' + (qa === 0 && r.porDia.some(function(x){ return x.g; }) ? ' g' : '') + '">' + num(q) + (qa > 0 && qa < q ? '<small class="cv p">✓ ' + num(qa) + '</small>' : '') + '</td>' : '<td class="z">–</td>'; });
    if (hayDesp) { var dq = r.porDia.filter(function(x){ return cols.indexOf(x.f) < 0; }).reduce(function(s, x){ return s + (x.q || 0); }, 0); tot.desp += dq; h += dq > 0 ? '<td class="q">' + num(dq) + '</td>' : '<td class="z">–</td>'; }
    tot.total += r.total; h += '<td class="q">' + num(r.total) + '</td><td class="s ' + r.cls + '">' + esc(r.est) + '</td></tr>';
  });
  h += '<tr class="tot"><td class="m" ' + (tipo === 'assy' ? '' : 'colspan="2"') + '>' + esc(tr3(T.total)) + '</td><td></td>';
  tot.cols.forEach(function(q){ h += '<td>' + (q > 0 ? num(q) : '–') + '</td>'; });
  if (hayDesp) h += '<td>' + (tot.desp > 0 ? num(tot.desp) : '–') + '</td>';
  return h + '<td>' + num(tot.total) + '</td><td></td></tr></tbody></table>';
}

function tablaSinMat(rows, tipo){
  if (!rows.length) return '';
  var h = '<div class="nomat">' + esc(T.sinMat) + '</div><table class="p"><thead><tr><th style="text-align:left">' + th3(tipo === 'assy' ? T.modelo : T.linea) + '</th>' + (tipo === 'assy' ? '' : '<th>' + th3(T.pieza) + '</th>') + '<th>' + th3(T.envio) + '</th><th>' + th3(T.pend) + '</th><th style="text-align:left">' + th3(T.estado) + '</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h += '<tr><td class="m">' + esc(r.et) + (r.sub ? '<small>' + esc(r.sub) + '</small>' : '') + '</td>' + (tipo === 'assy' ? '' : '<td style="text-align:left">' + esc(r.pieza) + '</td>') + '<td style="text-align:center">' + esc(fechaEnvio(r.fecha)) + '</td><td>' + num(r.total) + '</td><td class="s no">' + esc(r.est) + '</td></tr>';
  });
  return h + '</tbody></table>';
}
function bloque(k, X){
  var vacioOk = !X.A[k].length && X.N[k].length;
  return (vacioOk ? '' : tablaHtml(X.A[k], X.cols, X.hayDesp, k === 'assy' ? 'assy' : k)) + tablaSinMat(X.N[k], k === 'assy' ? 'assy' : k);
}
// ===== Pantalla =====
function pintar(){
  if (!DATOS) { root.innerHTML = '<div class="msg">' + esc(T.cargando) + '</div>'; return; }
  var X = armar(), pubs = [];
  var secs = '';
  if (AREAS.assy)   { secs += '<div class="sec a">' + esc(T.assy) + '</div>' + bloque('assy', X); if (DATOS.assy) pubs.push('ASSY ' + fechaHora(DATOS.assy.publicadoEn)); }
  if (AREAS.medio)  { secs += '<div class="sec m">' + esc(T.medio) + '</div>' + bloque('medio', X); if (DATOS.medio) pubs.push('RGB ' + fechaHora(DATOS.medio.publicadoEn)); }
  if (AREAS.bundle) { secs += '<div class="sec b">' + esc(T.bundle) + '</div>' + bloque('bundle', X); if (DATOS.bundle) pubs.push('Bundle ' + fechaHora(DATOS.bundle.publicadoEn)); }
  var sem = 'W' + isoSemana(new Date());   // misma semana que el asunto del correo (fecha de hoy)
  root.innerHTML =
    '<div class="bar"><h1>' + esc(T.titulo) + '</h1>' +
    '<span class="noprint">' + ['assy','medio','bundle'].map(function(k){ return '<label class="chk"><input type="checkbox" ' + (AREAS[k] ? 'checked' : '') + ' onchange="AREAS.' + k + '=this.checked;pintar()"> ' + (k === 'assy' ? 'ASSY' : k === 'medio' ? 'Medio proceso' : 'Bundle') + '</label>'; }).join('') + '</span>' +
    '<button class="btn" onclick="window.print()">' + esc(T.imprimir) + '</button><button class="btn w" id="btnWa" onclick="enviarWhatsApp()">' + esc(T.wa) + '</button><button class="btn g" onclick="fijarPlan()">' + esc(T.fijar) + '</button><button class="btn g" onclick="verCambios()">' + esc(T.cambios) + '</button><button class="btn g" onclick="verVivo()">' + esc(T.act) + '</button></div>' +
    '<div class="msg" id="msg"></div>' +
    '<div class="sheet" id="sheet"><h2>' + esc(T.titulo) + (sem ? ' — ' + sem : '') + '</h2><div class="sub"><b style="color:' + (FIJO ? '#0a7a3e' : '#b3261e') + '">' + esc(FIJO ? T.lbFijo + ': ' + fechaHora(FIJO.en) : T.lbVivo) + '</b><br>' + esc(T.pub) + ': ' + esc(pubs.join(' · ') || '—') + '</div>' + secs + '<div class="foot">' + esc(textoFuente()) + '<br>' + esc(T.nota) + '</div></div><div id="panelCambios" class="noprint"></div>';
}
function msg(t, cls){ var m = document.getElementById('msg'); if (m) { m.className = 'msg ' + (cls || ''); m.textContent = t || ''; } }

// ===== Auditoría: de dónde salen los datos y qué cambió =====
function horaCorta(ms){ if (!ms) return '—'; var d = new Date(ms); return d.toLocaleDateString('en-GB').slice(0, 5) + ' ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}); }
function textoFuente(){
  var f = DATOS && DATOS.assy && DATOS.assy.fuente; if (!f) return T.datosDe + ': —';
  var i = f.ims, q = f.shipqr;
  var ti = !i ? '—' : horaCorta(i.t) + ' (' + (i.tipo === 'completa' ? T.tComp : T.tHue) + ')';
  var tq = !q ? '—' : horaCorta(q.t) + ' (' + (q.tipo === 'cache' ? T.tCache : T.tLect) + ')';
  return T.datosDe + ' — ' + T.ims.split(' · ')[0] + ': ' + ti + ' · ' + T.shq.split(' · ')[0] + ': ' + tq + ' · ' + T.equipo + ' ' + (f.equipo || '—');
}
function verCambios(){
  var el = document.getElementById('panelCambios'); if (!el) return;
  if (el.innerHTML) { el.innerHTML = ''; return; }
  var H = (DATOS && DATOS.assy && DATOS.assy.historial) || [];
  var h = '<div class="sheet" style="margin-top:12px"><h2 style="font-size:16px">' + esc(T.cambios) + '</h2>';
  if (!H.length) h += '<div class="vacio">' + esc(T.sinCambios) + '</div>';
  H.slice(0, 8).forEach(function(e){
    h += '<div style="margin:10px 0 2px;font-weight:700;font-size:13px">' + esc(horaCorta(Date.parse(e.ts))) + ' · ' + esc((e.por || '').split('@')[0]) + ' · ' + esc(T.equipo) + ' ' + esc((e.fuente && e.fuente.equipo) || '—') + (e.fuente && e.fuente.auto ? ' · auto' : ' · manual') + '</div>';
    h += '<div style="font-size:12px;color:#555;margin-bottom:3px">' + esc(textoFuenteDe(e.fuente)) + '</div><table class="p"><tbody>';
    (e.cambios || []).forEach(function(c){
      if (c.nuevo) { h += '<tr><td class="m">' + esc(c.sm) + '</td><td class="s">' + esc(T.nuevoL) + '</td></tr>'; return; }
      var t = [];
      if (c.pendA !== c.pendN) t.push(T.pendL + ' ' + num(c.pendA) + ' → ' + num(c.pendN));
      if (c.prodA !== c.prodN) t.push(T.prodL + ' ' + num(c.prodA) + ' → ' + num(c.prodN));
      if (c.capA !== c.capN) t.push(T.matL + ' ' + (c.capA == null ? '—' : num(c.capA)) + ' → ' + (c.capN == null ? '—' : num(c.capN)));
      h += '<tr><td class="m">' + esc(c.sm) + '</td><td class="s">' + esc(t.join(' · ')) + '</td></tr>';
    });
    h += '</tbody></table>';
  });
  el.innerHTML = h + '</div>';
}
function textoFuenteDe(f){
  if (!f) return '';
  var i = f.ims, q = f.shipqr;
  return 'IMS: ' + (i ? horaCorta(i.t) + ' (' + (i.tipo === 'completa' ? T.tComp : T.tHue) + ')' : '—') + ' · ShipQR: ' + (q ? horaCorta(q.t) + ' (' + (q.tipo === 'cache' ? T.tCache : T.tLect) + ')' : '—') + ' · ' + (f.version || '');
}

// ===== WhatsApp: imagen + texto en 3 idiomas =====
function cargarH2C(){
  if (window.html2canvas) return Promise.resolve();
  return new Promise(function(ok, no){ var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'; s.onload = ok; s.onerror = function(){ no(new Error('h2c')); }; document.head.appendChild(s); });
}
function textoWa(){
  var X = armar(), sem = 'W' + isoSemana(new Date());
  var rango = '';
  if (X.cols.length) { var a = fechaD(X.cols[0]), b = fechaD(X.cols[X.cols.length - 1]); rango = a.getDate() + '–' + b.getDate() + ' ' + MESES[b.getMonth()][1]; }
  return '📋 Plan de producción · Production plan · 생산 계획' + (sem ? ' ' + sem : '') + (rango ? ' (' + rango + ')' : '') + '\n' +
    '🇲🇽 ASSY, Medio proceso y Bundle por día.\n🇺🇸 ASSY, Mid process and Bundle by day.\n🇰🇷 ASSY, 중간공정, 번들 일별.';
}
function enviarWhatsApp(){
  var btn = document.getElementById('btnWa'); if (btn) btn.disabled = true; msg(T.genImg);
  var texto = textoWa();
  cargarH2C().then(function(){ return window.html2canvas(document.getElementById('sheet'), { backgroundColor: '#ffffff', scale: 2, logging: false, windowWidth: 1700, onclone: function(doc){ var e = doc.getElementById('sheet'); if (e) e.classList.add('foto'); } }); }).then(function(cv){
    return new Promise(function(ok){ cv.toBlob(ok, 'image/png'); });
  }).then(function(blob){
    if (!blob) throw new Error('blob');
    var nombre = 'Plan_Dia_' + new Date().toISOString().slice(0, 10) + '.png', file = new File([blob], nombre, { type: 'image/png' });
    // Celular: abre el menú de compartir con la imagen ya adjunta (WhatsApp aparece ahí)
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], text: texto }).then(function(){ msg('✅', 'ok'); }).catch(function(e){ if (e && e.name === 'AbortError') msg(''); else throw e; });
    }
    // Computadora: copia la imagen al portapapeles (o la descarga) y abre WhatsApp con el texto
    var abrir = function(m){ window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank'); msg(m, 'ok'); };
    if (navigator.clipboard && window.ClipboardItem) {
      return navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]).then(function(){ abrir(T.waCopiada); }, function(){ descargar(blob, nombre); abrir(T.waDescargada); });
    }
    descargar(blob, nombre); abrir(T.waDescargada);
  }).catch(function(){ msg(T.errImg, 'er'); }).then(function(){ if (btn) btn.disabled = false; });
}
function descargar(blob, nombre){ var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000); }

// ===== Arranque =====
var arrancado = false;
firebase.auth().onAuthStateChanged(function(u){
  if (!u) { mostrarLogin(); return; }
  if (arrancado) return; arrancado = true; pintar();
  leerDatos().then(pintar).catch(function(){ arrancado = false; });
});
